<!DOCTYPE html>
<html lang="en" data-theme="grid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid5h3LL — Linux training system</title>
<meta name="description" content="Interactive Linux learning system: lessons, command reference, simulated terminal, adaptive practice, scenarios, and a game.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%2302060a'/><path d='M14 22l14 10-14 10' stroke='%233fe0ff' stroke-width='5' fill='none'/><path d='M32 44h18' stroke='%233fe0ff' stroke-width='5'/></svg>">
<style>
/* ===== Tokens ===== */
:root{
  --void:#02060a; --panel:#061019; --panel2:#0a1824; --raise:#0e2130;
  --line:#143a4d; --line2:#1f5870;
  --cyan:#3fe0ff; --cyan2:#9df0ff; --cyan-d:#1f8aa3; --glow:rgba(63,224,255,.35);
  --amber:#ffa13d; --amber-d:#b8661a; --violet:#b69cff;
  --text:#dcf4ff; --muted:#8cb0c1; --faint:#5d7f90;
  --s1:#1d4b5f; --s2:#1f8aa3; --s3:#3fe0ff; --s4:#e9fbff; /* stage colors */
  --font-d:"Chakra Petch","Bahnschrift","Segoe UI",system-ui,sans-serif;
  --font-b:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-m:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --fs:17px; --r:4px; --cut:12px;
  --nav-w:236px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --void:#eef4f7; --panel:#ffffff; --panel2:#f4f9fb; --raise:#e6f0f4;
  --line:#c3d6de; --line2:#8fb2c0;
  --cyan:#006d86; --cyan2:#004f62; --cyan-d:#3b93a8; --glow:rgba(0,109,134,.18);
  --amber:#a44d00; --amber-d:#c9782c; --violet:#5a3fc0;
  --text:#0b2430; --muted:#3e5f6d; --faint:#6a8794;
  --s1:#c3d6de; --s2:#6fb4c6; --s3:#0a8bab; --s4:#003846;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs)}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);font-family:var(--font-b);line-height:1.55;
  background-image:
    linear-gradient(var(--void),transparent 40%),
    linear-gradient(to right, color-mix(in srgb,var(--line) 45%,transparent) 1px, transparent 1px),
    linear-gradient(to bottom, color-mix(in srgb,var(--line) 45%,transparent) 1px, transparent 1px);
  background-size:100% 100%,48px 48px,48px 48px;background-attachment:fixed}
a{color:var(--cyan)}
code,kbd,pre,.mono{font-family:var(--font-m)}
code{color:var(--cyan2);background:color-mix(in srgb,var(--cyan) 9%,transparent);padding:.05em .35em;border-radius:3px;font-size:.92em}
pre{background:var(--void);border:1px solid var(--line);padding:.8rem 1rem;overflow-x:auto;border-radius:var(--r);font-size:.9rem;line-height:1.5;color:var(--cyan2)}
pre code{background:none;padding:0}
kbd{border:1px solid var(--line2);border-bottom-width:2px;padding:0 .35em;border-radius:3px;font-size:.8em;color:var(--muted)}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;line-height:1.2;margin:0 0 .6rem;letter-spacing:.01em}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.12rem} h4{font-size:1rem;color:var(--muted)}
p{margin:0 0 .8rem;max-width:72ch}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;box-shadow:0 0 0 5px var(--glow)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--cyan);color:var(--void);padding:.5rem 1rem;z-index:99}
.skip:focus{left:1rem;top:1rem}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent)}
.brand{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1.2rem;border-bottom:1px solid var(--line)}
.brand svg{flex:none}
.brand b{font-family:var(--font-d);font-size:1.25rem;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 12px var(--glow)}
.brand small{display:block;color:var(--faint);font-size:.72rem;letter-spacing:.02em}
.nav{list-style:none;margin:0;padding:.6rem;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:.75rem;padding:.62rem .8rem;border:1px solid transparent;background:none;cursor:pointer;text-align:left;border-radius:var(--r);color:var(--muted);font-family:var(--font-d);font-size:1rem;font-weight:500}
.nav button svg{flex:none;width:20px;height:20px}
.nav button:hover{color:var(--text);background:var(--panel2)}
.nav button[aria-selected="true"]{color:var(--cyan);border-color:var(--line2);background:linear-gradient(90deg,color-mix(in srgb,var(--cyan) 14%,transparent),transparent);box-shadow:inset 3px 0 0 var(--cyan)}
.nav .badge{margin-left:auto;font-family:var(--font-m);font-size:.72rem;background:var(--amber);color:#1a0d00;border-radius:10px;padding:0 .45rem;min-width:1.4rem;text-align:center}
.side-foot{padding:.8rem 1rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;gap:.5rem}
.lvl-chip{display:flex;justify-content:space-between;align-items:center}
.lvl-chip b{font-family:var(--font-d);color:var(--cyan)}
.xpbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.main{min-width:0;padding:1.6rem clamp(1rem,3vw,2.4rem) 4rem}
.view{display:none;max-width:1320px;margin:0 auto}
.view.active{display:block}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.2rem}
.view-head p{color:var(--muted);margin:0}

/* ===== Panels ===== */
.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:1.1rem 1.2rem;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.panel::before{content:"";position:absolute;right:0;top:0;width:calc(var(--cut)*1.42);height:1px;background:var(--line2);transform:rotate(45deg);transform-origin:top right;translate:0 0}
.panel.hot{border-color:var(--cyan-d);box-shadow:inset 0 0 30px color-mix(in srgb,var(--cyan) 8%,transparent)}
.panel h3{display:flex;align-items:center;gap:.5rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.86rem}
.warn{color:var(--amber)}
.stack>*+*{margin-top:.8rem}

/* ===== Buttons & inputs ===== */
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border:1px solid var(--cyan-d);background:color-mix(in srgb,var(--cyan) 8%,transparent);color:var(--cyan2);border-radius:var(--r);cursor:pointer;font-family:var(--font-d);font-weight:600;font-size:.95rem;letter-spacing:.02em;min-height:42px}
.btn:hover{background:color-mix(in srgb,var(--cyan) 18%,transparent);box-shadow:0 0 14px var(--glow)}
.btn.primary{background:var(--cyan);color:var(--void);border-color:var(--cyan)}
.btn.primary:hover{background:var(--cyan2)}
.btn.ghost{border-color:var(--line2);background:none;color:var(--text)}
.btn.danger{border-color:var(--amber-d);color:var(--amber);background:color-mix(in srgb,var(--amber) 8%,transparent)}
.btn.sm{padding:.3rem .65rem;min-height:34px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.inp{width:100%;padding:.6rem .8rem;background:var(--void);border:1px solid var(--line2);border-radius:var(--r);min-height:44px}
.inp:focus{border-color:var(--cyan)}
.inp.mono{font-family:var(--font-m)}
select.inp{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.28rem .7rem;border:1px solid var(--line2);border-radius:20px;background:none;cursor:pointer;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.tag{display:inline-block;font-size:.75rem;padding:.05rem .5rem;border:1px solid var(--line2);border-radius:3px;color:var(--muted);font-family:var(--font-m)}
.tag.cyan{border-color:var(--cyan-d);color:var(--cyan)}
.tag.amber{border-color:var(--amber-d);color:var(--amber)}
.tag.violet{border-color:color-mix(in srgb,var(--violet) 60%,transparent);color:var(--violet)}

/* ===== Dashboard ===== */
.hero{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:1.2rem;align-items:stretch}
.disc-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.disc{width:100%;max-width:300px;aspect-ratio:1}
.disc .seg{transition:stroke-dasharray .8s ease}
.disc-label{font-family:var(--font-d)}
.stat{padding:.8rem 1rem;border-left:2px solid var(--line2)}
.stat b{display:block;font-family:var(--font-d);font-size:1.7rem;color:var(--cyan);line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
.next-card{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next-card h2{margin:0 0 .25rem}
.bars{display:flex;flex-direction:column;gap:.55rem}
.bar{display:grid;grid-template-columns:minmax(120px,11rem) 1fr 3.2rem;gap:.7rem;align-items:center;font-size:.9rem}
.bar .track{height:10px;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.bar .track i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan-d),var(--cyan));box-shadow:0 0 10px var(--glow)}
.bar .v{font-family:var(--font-m);text-align:right;color:var(--muted);font-size:.82rem}
.mmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:4px}
.mcell{font-family:var(--font-m);font-size:.74rem;padding:.4rem .2rem;text-align:center;border:1px solid var(--line);background:var(--void);color:var(--faint);cursor:pointer;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell.st1{border-color:var(--s1);color:var(--muted)}
.mcell.st2{border-color:var(--s2);color:var(--text);background:color-mix(in srgb,var(--s2) 15%,transparent)}
.mcell.st3{border-color:var(--s3);color:var(--cyan2);background:color-mix(in srgb,var(--s3) 22%,transparent)}
.mcell.st4{border-color:var(--s4);color:var(--void);background:var(--s3);box-shadow:0 0 8px var(--glow);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:.8rem;color:var(--muted);margin-top:.6rem}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid;vertical-align:-2px;margin-right:.3rem}
.feed{list-style:none;margin:0;padding:0;font-size:.9rem}
.feed li{display:flex;gap:.7rem;padding:.45rem 0;border-bottom:1px dashed var(--line)}
.feed li:last-child{border:0}
.feed time{color:var(--faint);font-family:var(--font-m);font-size:.78rem;min-width:4.4rem}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.5rem}
.ach div{padding:.55rem .7rem;border:1px solid var(--line);font-size:.82rem;color:var(--faint);border-radius:var(--r)}
.ach div b{display:block;font-family:var(--font-d);font-size:.92rem}
.ach div.on{border-color:var(--cyan-d);color:var(--muted)}
.ach div.on b{color:var(--cyan)}
.chart{width:100%;height:220px}
.chart text{fill:var(--faint);font-family:var(--font-m);font-size:11px}

/* ===== Learn ===== */
.learn{display:grid;grid-template-columns:320px 1fr;gap:1.2rem;align-items:start}
.mods{display:flex;flex-direction:column;gap:.5rem;position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto;padding-right:.3rem}
.mod h4{margin:.4rem 0 .3rem;font-size:.9rem}
.lesson-btn{display:flex;width:100%;gap:.6rem;align-items:center;text-align:left;background:none;border:1px solid transparent;padding:.45rem .6rem;border-radius:var(--r);cursor:pointer;color:var(--text);font-size:.92rem}
.lesson-btn:hover{background:var(--panel2)}
.lesson-btn[aria-current="true"]{border-color:var(--cyan-d);background:color-mix(in srgb,var(--cyan) 8%,transparent)}
.lesson-btn .dot{width:10px;height:10px;border:1px solid var(--line2);flex:none;transform:rotate(45deg)}
.lesson-btn .dot.done{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.lesson h2{font-size:1.6rem}
.lesson section{margin:1.2rem 0}
.lesson ul{padding-left:1.2rem;max-width:72ch}
.lesson li{margin:.25rem 0}
.callout{border-left:3px solid var(--cyan);padding:.6rem .9rem;background:color-mix(in srgb,var(--cyan) 6%,transparent);margin:.8rem 0;max-width:76ch}
.callout.warn{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,transparent)}
.callout.warn strong{color:var(--amber)}
.distro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.6rem 0}
.distro div{border:1px solid var(--line);padding:.5rem .7rem;font-size:.88rem}
.distro div.pref{border-color:var(--cyan)}

/* ===== Command center ===== */
.cc{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:1.2rem;align-items:start}
.cmd-list{list-style:none;margin:.6rem 0 0;padding:0;max-height:calc(100vh - 16rem);overflow:auto;border:1px solid var(--line)}
.cmd-list button{width:100%;display:flex;justify-content:space-between;gap:.5rem;padding:.55rem .8rem;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left}
.cmd-list button:hover{background:var(--panel2)}
.cmd-list button[aria-current="true"]{background:color-mix(in srgb,var(--cyan) 12%,transparent);box-shadow:inset 3px 0 0 var(--cyan)}
.cmd-list .n{font-family:var(--font-m);color:var(--cyan2)}
.cmd-list .p{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.cmd-flow{display:grid;grid-template-columns:9rem 1fr;border-top:1px solid var(--line)}
.cmd-flow>dt{padding:.7rem .4rem .7rem 0;color:var(--faint);font-family:var(--font-d);font-size:.92rem;border-bottom:1px solid var(--line)}
.cmd-flow>dd{margin:0;padding:.7rem 0;border-bottom:1px solid var(--line);min-width:0}
.opts{width:100%;border-collapse:collapse;font-size:.9rem}
.opts td{padding:.25rem .5rem .25rem 0;vertical-align:top}
.opts td:first-child{font-family:var(--font-m);color:var(--cyan2);white-space:nowrap}

/* ===== Terminal ===== */
.term-layout{display:grid;grid-template-columns:1fr 340px;gap:1.2rem;align-items:start}
.term{background:#010407;border:1px solid var(--cyan-d);border-radius:var(--r);box-shadow:0 0 0 1px #000,0 0 30px color-mix(in srgb,var(--cyan) 12%,transparent);font-family:var(--font-m);font-size:.93rem;color:#c9f4ff;display:flex;flex-direction:column;height:min(66vh,620px);min-height:340px}
:root[data-theme="light"] .term{background:#0a1a22;color:#d9f6ff}
.term-bar{display:flex;align-items:center;gap:.6rem;padding:.4rem .8rem;border-bottom:1px solid var(--line);font-size:.78rem;color:#7fa9ba;font-family:var(--font-b)}
.term-bar .sim{margin-left:auto;border:1px solid #b8661a;color:#ffb35f;padding:0 .45rem;border-radius:3px}
.term-out{flex:1;overflow:auto;padding:.7rem .9rem;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.term-out .ps1{color:#3fe0ff}
.term-out .err{color:#ffb35f}
.term-out .dir{color:#6fb6ff;font-weight:600}
.term-out .exe{color:#7dffb2}
.term-out .note{color:#8cb0c1;font-style:italic}
.term-in{display:flex;align-items:center;gap:.5rem;padding:.5rem .9rem;border-top:1px solid var(--line)}
.term-in label{color:#3fe0ff;white-space:nowrap}
.term-in input{flex:1;background:none;border:0;color:#e9fbff;outline:none;font:inherit;min-width:0;caret-color:#3fe0ff}
.term-in:focus-within{box-shadow:inset 0 0 0 1px #3fe0ff}
.chal{border:1px solid var(--line);padding:.6rem .7rem;border-radius:var(--r);cursor:pointer;background:none;width:100%;text-align:left;display:flex;gap:.6rem;align-items:flex-start}
.chal:hover{border-color:var(--line2)}
.chal.active{border-color:var(--cyan)}
.chal.done .t::after{content:" ✓";color:var(--cyan)}
.chal .t{font-weight:600;font-size:.92rem}
.chal .d{font-size:.8rem;color:var(--muted)}

/* ===== Practice ===== */
.q-wrap{max-width:900px}
.q-meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.7rem}
.q-prompt{font-size:1.18rem;font-weight:500;max-width:70ch}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:8px;height:8px;border:1px solid var(--cyan-d);transform:rotate(45deg)}
.pips i.on{background:var(--cyan)}
.opts-list{display:flex;flex-direction:column;gap:.5rem;margin:1rem 0}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;padding:.7rem .9rem;border:1px solid var(--line2);background:var(--void);border-radius:var(--r);cursor:pointer;width:100%}
.opt:hover:not([disabled]){border-color:var(--cyan-d);background:var(--panel2)}
.opt .k{font-family:var(--font-m);color:var(--faint);min-width:1.4rem}
.opt code{background:none;padding:0}
.opt.right{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 12%,transparent)}
.opt.wrong{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,transparent)}
.opt[disabled]{cursor:default}
.opt .why{display:block;font-size:.84rem;color:var(--muted);margin-top:.25rem}
.seq{display:flex;flex-direction:column;gap:.4rem;margin:1rem 0}
.seq-item{display:flex;gap:.6rem;align-items:center;border:1px solid var(--line2);padding:.5rem .7rem;border-radius:var(--r);background:var(--void)}
.seq-item .num{font-family:var(--font-m);color:var(--cyan);min-width:1.4rem}
.seq-item code{flex:1;background:none}
.match-row{display:grid;grid-template-columns:1fr minmax(160px,14rem);gap:.6rem;align-items:center;margin:.4rem 0}
.fb{margin-top:1rem;border-left:3px solid var(--cyan);padding:.8rem 1rem;background:color-mix(in srgb,var(--cyan) 6%,transparent)}
.fb.bad{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 6%,transparent)}
.fb h3{margin:0 0 .4rem}
.fb.bad h3{color:var(--amber)} .fb.good h3{color:var(--cyan)}
.fb dl{display:grid;grid-template-columns:8.5rem 1fr;gap:.35rem .8rem;margin:.5rem 0 0;font-size:.93rem}
.fb dt{color:var(--faint)} .fb dd{margin:0}
.progress-strip{display:flex;gap:4px;margin:.5rem 0 1rem}
.progress-strip i{flex:1;height:5px;background:var(--line)}
.progress-strip i.ok{background:var(--cyan)}
.progress-strip i.no{background:var(--amber)}
.progress-strip i.cur{background:var(--cyan2);opacity:.5}

/* ===== Scenario ===== */
.scn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.scn-card{display:flex;flex-direction:column;gap:.5rem;cursor:pointer;text-align:left;color:inherit}
.scn-card:hover{border-color:var(--cyan-d)}
.scn-log{font-family:var(--font-m);font-size:.9rem;background:#010407;color:#c9f4ff;border:1px solid var(--line2);padding:.8rem;max-height:46vh;overflow:auto;white-space:pre-wrap;border-radius:var(--r)}
.scn-log .ps1{color:#3fe0ff}.scn-log .err{color:#ffb35f}.scn-log .note{color:#8cb0c1;font-style:italic}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.35rem;font-size:.88rem}
.steps li{padding:.35rem .6rem;border-left:2px solid var(--line)}
.steps li.cur{border-color:var(--cyan);color:var(--text)}
.steps li.done{border-color:var(--cyan-d);color:var(--muted)}
.steps li.todo{color:var(--faint)}

/* ===== Game ===== */
.game-wrap{display:grid;grid-template-columns:1fr 300px;gap:1.2rem;align-items:start}
.stage{position:relative;border:1px solid var(--cyan-d);background:#010407;box-shadow:0 0 30px color-mix(in srgb,var(--cyan) 14%,transparent)}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/10}
.stage .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8rem;background:rgba(1,4,7,.84);padding:1rem;color:#dcf4ff}
.stage .overlay h2{color:#3fe0ff;font-size:2rem;text-shadow:0 0 18px rgba(63,224,255,.6)}
.stage .overlay p{color:#9ec3d3}
.game-in{display:flex;gap:.5rem;margin-top:.6rem}
.game-in input{flex:1;font-family:var(--font-m);font-size:1.1rem}
.hs{width:100%;border-collapse:collapse;font-size:.88rem}
.hs td,.hs th{padding:.3rem .4rem;border-bottom:1px solid var(--line);text-align:left}
.hs th{color:var(--faint);font-weight:500}
.hs td.n{font-family:var(--font-m);text-align:right;color:var(--cyan2)}

/* ===== Progress ===== */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:620px}
.tbl th,.tbl td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--faint);font-weight:500;cursor:pointer;white-space:nowrap}
.tbl th[aria-sort]::after{content:" ↕";opacity:.4}
.tbl td.num{font-family:var(--font-m);text-align:right}
.stage-pill{font-size:.75rem;padding:.05rem .5rem;border-radius:10px;border:1px solid}
.stage-pill.s0{color:var(--faint);border-color:var(--line)}
.stage-pill.s1{color:var(--muted);border-color:var(--s1)}
.stage-pill.s2{color:var(--text);border-color:var(--s2)}
.stage-pill.s3{color:var(--cyan);border-color:var(--s3)}
.stage-pill.s4{color:var(--void);background:var(--cyan);border-color:var(--cyan)}

/* ===== Modal & toast ===== */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--cyan-d);max-width:min(560px,92vw);padding:1.3rem 1.4rem;border-radius:var(--r);box-shadow:0 0 40px var(--glow)}
dialog::backdrop{background:rgba(0,0,0,.65)}
.toasts{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.5rem;z-index:50;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--cyan-d);padding:.6rem 1rem;border-radius:var(--r);box-shadow:0 0 20px var(--glow);font-size:.92rem;animation:tin .25s ease-out}
.toast.amber{border-color:var(--amber-d)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.mobile-top{display:none}

/* ===== Responsive ===== */
@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .term-layout,.game-wrap{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--panel)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:.3rem;gap:0}
  .nav li{flex:1 0 auto}
  .nav button{flex-direction:column;gap:.15rem;font-size:.7rem;padding:.4rem .55rem;min-width:64px;align-items:center;text-align:center}
  .nav button[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--cyan)}
  .nav .badge{position:absolute;margin:0;transform:translate(14px,-4px)}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:30}
  .mobile-top b{font-family:var(--font-d);letter-spacing:.14em;color:var(--cyan)}
  .main{padding:1rem 1rem 6.5rem}
  .learn,.cc{grid-template-columns:1fr}
  .mods{position:static;max-height:none}
  .cmd-list{max-height:40vh}
  .g2,.g3{grid-template-columns:1fr}
  .span2,.span3{grid-column:auto}
  .cmd-flow{grid-template-columns:1fr}
  .cmd-flow>dt{border-bottom:0;padding-bottom:0}
  .distro{grid-template-columns:1fr}
  .fb dl{grid-template-columns:1fr}
  .toasts{bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.5rem}
}
@media (max-width:520px){
  .g4{grid-template-columns:1fr 1fr}
  .bar{grid-template-columns:7rem 1fr 2.8rem}
  .match-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
:root.reduce-motion *{animation-duration:.001ms!important;transition-duration:.001ms!important}
.app>div,.grid>*,.cc>*,.learn>*,.term-layout>*,.game-wrap>*,.hero>*{min-width:0}
.chart{height:auto;aspect-ratio:640/220}
[hidden]{display:none!important}
#tin:focus-visible,#gin:focus-visible{outline:none;box-shadow:none}

/* ===== Nux ===== */
.nux{display:block;overflow:visible}
.nux-head{width:92px;height:auto;flex:none;filter:drop-shadow(0 0 10px rgba(63,224,255,.25))}
.bob{animation:nuxbob 3.2s ease-in-out infinite}
@keyframes nuxbob{50%{transform:translateY(-6px)}}
.nux-track{position:relative;height:86px;margin:-.3rem 0 1rem;overflow:hidden;border-bottom:1px solid var(--line2);background:linear-gradient(to top,color-mix(in srgb,var(--cyan) 8%,transparent),transparent)}
.nux-track .rider{position:absolute;bottom:0;left:-170px;width:136px;animation:nuxride 12s cubic-bezier(.55,0,.35,1) infinite}
.nux-track .rider::before,.nux-zoom .nux-trail{content:"";position:absolute;right:86%;bottom:3px;height:4px;width:70vw;background:linear-gradient(to left,var(--cyan),transparent);box-shadow:0 0 12px var(--cyan);border-radius:2px}
@keyframes nuxride{0%{left:-170px}42%,100%{left:calc(100% + 40px)}}
.nux-track .disc-parked{position:absolute;right:18px;bottom:8px;width:34px;opacity:.8}
.nux-flydisc{position:fixed;width:38px;height:38px;margin:-19px 0 0 -19px;z-index:60;pointer-events:none}
.nux-flydisc .nux{width:100%;height:100%}
.nux-zoom{position:absolute;left:0;bottom:6px;width:120px;pointer-events:none;z-index:5}
.term{position:relative;overflow:hidden}
.fb .nux-fb{float:right;width:88px;margin:-.3rem 0 .3rem 1rem}
.overlay .nux{width:120px}
dialog .nux-dlg{float:right;width:70px;margin:0 0 .5rem 1rem}
.empty-nux{display:flex;align-items:center;gap:1rem}
.empty-nux .nux{width:70px}
@media (max-width:860px){.nux-head{width:64px}.nux-track{height:70px}.nux-track .rider{width:110px}.fb .nux-fb{width:64px}}
@media (prefers-reduced-motion:reduce){.bob,.nux-track .rider{animation:none}.nux-track .rider{left:38%}}
:root.reduce-motion .nux-track .rider{animation:none;left:38%}
:root.reduce-motion .bob{animation:none}
.fb.good .nux-fb{animation:nuxhop .7s ease-out}
.fb.bad .nux-fb{animation:nuxduck .7s ease-out}
@keyframes nuxhop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0)}}
@keyframes nuxduck{25%{transform:translateY(8px) scaleY(.9)}50%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>

  {id:'c:dns',      cat:'net',   name:'DNS'},
  {id:'c:exit',     cat:'shell', name:'Exit codes'},

];

/* n name · c category · l level 1-3 · p purpose · s syntax · o options · e examples [cmd, explanation]
   x explanation (why/when) · sc practical scenario · note distro/shell differences · danger warning · rel related */
const COMMANDS = [
/* ---------- fundamentals ---------- */
{n:'man',c:'fund',l:1,p:'Read the manual page for a command.',s:'man [section] command',

 e:[['rm old.log','Delete one file.'],['rm -ri build/','Delete a directory, confirming each item.']],

{n:'ln',c:'nav',l:2,p:'Create links between files.',s:'ln [-s] target linkname',

 x:'Symbolic links can cross filesystems and point to directories; they break if the target moves.',

{n:'less',c:'view',l:1,p:'Page through a file one screen at a time.',s:'less file',

/* =====================================================================
   DATA · curriculum. Each lesson: id, cat, level, title, summary,
   sections [{h, html}], cmds (introduced), try (terminal suggestions),
   check (question ids used as the lesson check).
   ===================================================================== */
const LESSONS = [
{id:'L01',cat:'fund',lvl:1,title:'What Linux is',summary:'Kernel, distributions, shells and terminals — and how they fit together.',
 cmds:['uname','whoami','man','c:kernel','c:distro'],try:['uname -a','whoami','cat /etc/os-release'],check:['q-kern1','q-distro1'],
 sections:[
 {h:'The kernel',html:`<p>Linux is, strictly speaking, a <strong>kernel</strong>: the core program that manages the CPU, memory, disks and devices, and lets other programs share them safely. Everything else you use — the shell, <code>ls</code>, a web server — is <em>userland</em> software running on top of it.</p><p><code>uname -r</code> prints the kernel release you are running.</p>`},
 {h:'Distributions',html:`<p>A <strong>distribution</strong> bundles the kernel with GNU tools, a package manager, an init system and defaults. The commands you learn here work on all of them; the main differences are package management and some file locations.</p><div class="distro"><div><b>Debian / Ubuntu</b><br><span class="small muted">apt · .deb packages</span></div><div><b>Fedora / RHEL / Rocky</b><br><span class="small muted">dnf · .rpm packages</span></div><div><b>Arch</b><br><span class="small muted">pacman · rolling release</span></div></div><p><code>cat /etc/os-release</code> tells you which distribution you are on.</p>`},
 {h:'Shell and terminal',html:`<p>The <strong>terminal</strong> is the window that shows text. The <strong>shell</strong> is the program inside it that reads your commands and runs them. Most Linux systems default to <strong>Bash</strong>; macOS and some users prefer <strong>Zsh</strong>. Basic commands behave the same in both; scripting details differ.</p><div class="callout">The prompt <code>student@linux-lab:~$</code> tells you: user <code>student</code>, host <code>linux-lab</code>, current directory <code>~</code> (home), and <code>$</code> for a normal user. Root’s prompt usually ends in <code>#</code>.</div>`},
 {h:'Getting help',html:`<p><code>man ls</code> opens the manual for <code>ls</code>. Inside it, <kbd>/</kbd> searches and <kbd>q</kbd> quits. Many commands also accept <code>--help</code> for a short summary.</p>`}
 ]},
{id:'L02',cat:'fund',lvl:1,title:'The filesystem tree',summary:'One tree starting at /, where things live, and absolute versus relative paths.',
 cmds:['pwd','cd','ls','c:fhs','c:paths'],try:['pwd','ls /','cd /etc','cd -','ls -la ~'],check:['q-fhs1','q-path1','q-cd1'],
 sections:[
 {h:'One tree',html:`<p>Linux has no drive letters. Everything hangs from a single root directory, <code>/</code>. Other disks are <em>mounted</em> into folders inside this tree.</p><ul><li><code>/etc</code> — system configuration files</li><li><code>/home</code> — users’ personal directories</li><li><code>/var</code> — changing data: logs in <code>/var/log</code>, websites often in <code>/var/www</code></li><li><code>/usr/bin</code> — installed programs</li><li><code>/tmp</code> — temporary files, often cleared at boot</li><li><code>/root</code> — the root user’s home (not the same as <code>/</code>)</li></ul>`},
 {h:'Absolute and relative paths',html:`<p>A path that starts with <code>/</code> is <strong>absolute</strong>: it means the same thing from anywhere. Anything else is <strong>relative</strong> to your current directory (<code>pwd</code>).</p><ul><li><code>.</code> is the current directory, <code>..</code> the parent</li><li><code>~</code> expands to your home directory (a shell feature)</li></ul><pre><code>$ pwd
/home/student
$ cd projects/web      # relative
$ cd /var/log          # absolute
$ cd ..                # now in /var
$ cd -                 # back to /var/log</code></pre>`},
 {h:'Hidden files',html:`<p>Names starting with a dot, like <code>.bashrc</code>, are hidden from plain <code>ls</code>. <code>ls -a</code> shows them. They usually hold per-user settings.</p>`}
 ]},
{id:'L03',cat:'nav',lvl:1,title:'Creating, copying and moving',summary:'touch, mkdir, cp, mv — and how to delete safely with rm.',
 cmds:['touch','mkdir','cp','mv','rm','rmdir'],try:['mkdir -p lab/a/b','touch lab/notes.txt','cp lab/notes.txt lab/a/','mv lab/notes.txt lab/todo.txt','ls -R lab'],check:['q-mkdir1','q-cp1','q-rm1'],
 sections:[
 {h:'Make things',html:`<p><code>touch file</code> creates an empty file (or updates its timestamp). <code>mkdir dir</code> creates a directory; <code>mkdir -p a/b/c</code> creates the whole path and does not complain if it exists.</p>`},
 {h:'Copy and move',html:`<p><code>cp src dest</code> copies; add <code>-r</code> for directories. <code>mv src dest</code> moves, and renaming is just moving to a new name.</p><div class="callout warn"><strong>Both overwrite silently.</strong> If <code>dest</code> already exists, its contents are replaced without a question. Use <code>-i</code> to be asked first, and back up config files before you edit them: <code>cp app.conf app.conf.bak</code>.</div>`},
 {h:'Deleting safely',html:`<div class="callout warn"><strong>rm is permanent.</strong> There is no trash can. <code>rm -r</code> deletes whole directory trees, and <code>-f</code> suppresses every prompt and error. A stray space — <code>rm -rf / tmp</code> instead of <code>rm -rf /tmp</code> — targets the root of the system.</div><p>A safe habit:</p><ol><li><code>pwd</code> — where am I?</li><li><code>ls path</code> — is this exactly what I mean to delete?</li><li><code>rm -ri path</code> the first time, until you trust the path</li></ol><p><code>rmdir</code> only removes <em>empty</em> directories, which makes it the safest delete.</p>`}
 ]},
{id:'L04',cat:'view',lvl:1,title:'Reading files and output',summary:'cat, less, head, tail, and counting with wc.',
 cmds:['cat','less','more','head','tail','wc'],try:['cat /etc/hostname','head -n 3 /var/log/syslog','tail -n 5 /var/log/syslog','wc -l /var/log/syslog'],check:['q-tail1','q-less1','q-wc1'],
 sections:[
 {h:'Pick the right viewer',html:`<ul><li><code>cat</code> — dump a short file</li><li><code>less</code> — page through anything long; <kbd>/</kbd> search, <kbd>G</kbd> end, <kbd>q</kbd> quit</li><li><code>head -n 20</code> — the first lines (format checks)</li><li><code>tail -n 20</code> — the last lines (newest log entries)</li><li><code>tail -f</code> — keep watching a file as it grows</li></ul>`},
 {h:'Logs live at the bottom',html:`<p>Log files are appended to, so the newest events are at the end. <code>tail -f /var/log/nginx/error.log</code> while you reload a page is one of the most useful debugging moves in Linux.</p><p class="small muted">Log names differ: Debian/Ubuntu use <code>/var/log/syslog</code> and <code>auth.log</code>; RHEL/Fedora use <code>/var/log/messages</code> and <code>secure</code>. Everywhere with systemd, <code>journalctl</code> also works.</p>`},
 {h:'Counting',html:`<p><code>wc -l</code> counts lines. It shines at the end of a pipe: <code>grep error app.log | wc -l</code> is “how many errors?”</p>`}
 ]},
{id:'L05',cat:'text',lvl:1,title:'Pipes and redirection',summary:'Connect small tools into powerful one-liners and send output into files.',
 cmds:['c:pipes','c:redirect','sort','uniq','echo'],try:['cat /var/log/syslog | grep error','echo hello > hi.txt','echo again >> hi.txt','cat hi.txt','ls /nope 2> err.txt'],check:['q-pipe1','q-redir1','q-redir2','q-uniq1'],
 sections:[
 {h:'The pipe |',html:`<p>A pipe sends one command’s <em>standard output</em> into the next command’s <em>standard input</em>. Each tool does one job; the pipe combines them.</p><pre><code>ps aux | grep nginx
cat access.log | cut -d' ' -f1 | sort | uniq -c | sort -rn | head</code></pre><p>The second line reads: take the first column (IPs), sort them so duplicates sit together, count each, rank by count, show the top 10.</p>`},
 {h:'Redirection',html:`<ul><li><code>&gt; file</code> — write output to a file, <strong>replacing</strong> it</li><li><code>&gt;&gt; file</code> — append</li><li><code>&lt; file</code> — read input from a file</li><li><code>2&gt; file</code> — send errors (stream 2) to a file</li><li><code>2&gt;/dev/null</code> — throw errors away</li><li><code>&amp;&gt; file</code> — both output and errors (Bash)</li></ul><div class="callout warn"><strong>&gt; truncates first.</strong> <code>sort data.txt &gt; data.txt</code> empties the file before sort reads it. Write to a new file instead.</div>`},
 {h:'Three streams',html:`<p>Every process has stdin (0), stdout (1) and stderr (2). Keeping errors on a separate stream is why <code>2&gt;/dev/null</code> can hide “Permission denied” noise while normal output still flows through the pipe.</p>`}
 ]},
{id:'L06',cat:'text',lvl:2,title:'Searching with grep and find',summary:'Find text inside files with grep; find files themselves with find and locate.',
 cmds:['grep','find','locate','c:regex'],try:['grep -i error /var/log/syslog','grep -rn listen /etc/nginx','find /var/log -name "*.log"','find /home -type d -name projects'],check:['q-grep1','q-grep2','q-find1','q-find2'],
 sections:[
 {h:'grep: text inside files',html:`<p><code>grep pattern file</code> prints matching lines. The flags you will use daily: <code>-i</code> ignore case, <code>-r</code> recurse into directories, <code>-n</code> line numbers, <code>-v</code> invert, <code>-c</code> count, <code>-l</code> file names only.</p>`},
 {h:'Patterns',html:`<p>grep uses regular expressions: <code>^</code> start of line, <code>$</code> end, <code>.</code> any character, <code>*</code> zero or more of the previous item. <code>grep -E</code> adds <code>+</code>, <code>?</code> and <code>|</code>.</p><pre><code>grep '^#' app.conf        # comment lines
grep -v '^#' app.conf     # everything else
grep -E 'error|fail' app.log</code></pre>`},
 {h:'find: the files themselves',html:`<p><code>find</code> walks the directory tree and tests each entry.</p><pre><code>find /var/log -name "*.log" -mtime -1   # modified in the last 24h
find ~ -type f -size +500M               # big files
find . -name "*.tmp" -delete             # careful!</code></pre><p>Quote the pattern so the shell does not expand <code>*.log</code> itself. <code>locate</code> is faster because it searches a prebuilt index, but it misses recently created files until <code>updatedb</code> runs.</p>`}
 ]},
{id:'L07',cat:'text',lvl:3,title:'Transforming text: cut, tr, awk, sed',summary:'Extract columns, change characters, and edit streams.',
 cmds:['cut','tr','awk','sed'],try:["cut -d: -f1 /etc/passwd","echo hello | tr a-z A-Z"],check:['q-awk1','q-sed1','q-cut1'],
 sections:[
 {h:'Columns',html:`<p><code>cut -d: -f1 /etc/passwd</code> splits on colons and keeps field 1. For output aligned with varying spaces, <code>awk '{print $2}'</code> is easier because awk splits on any run of whitespace.</p>`},
 {h:'awk in one minute',html:`<pre><code>awk '{print $1}' access.log               # first column
awk -F: '$3 >= 1000 {print $1}' /etc/passwd  # pattern + action
awk '{sum += $10} END {print sum}' access.log</code></pre><p>A program is <code>pattern { action }</code>. <code>$1</code>… are fields, <code>NR</code> the line number, <code>NF</code> the field count.</p>`},
 {h:'sed for substitutions',html:`<p><code>sed 's/old/new/g' file</code> prints the file with every match replaced; the file is unchanged. <code>-i</code> edits in place.</p><div class="callout warn"><strong>Preview first.</strong> Run without <code>-i</code>, check the output, then add <code>-i.bak</code> so a backup is kept. Note: GNU sed (Linux) and BSD sed (macOS) differ in how <code>-i</code> takes its argument.</div>`}
 ]},
{id:'L08',cat:'perm',lvl:2,title:'Permissions and ownership',summary:'Read rwx, convert to numbers, and change them with chmod and chown.',
 cmds:['chmod','chown','chgrp','sudo','id','c:permbits'],try:['ls -l','chmod 755 scripts/backup.sh','ls -l scripts','chmod u-x scripts/backup.sh'],check:['q-perm1','q-perm2','q-perm3','q-chown1'],
 sections:[
 {h:'Reading ls -l',html:`<pre><code>-rwxr-x---  1  alice  devs  2048  Jan  5  deploy.sh
 └┬┘└┬┘└┬┘     └ owner└ group
  │  │  └ others: ---
  │  └ group:  r-x
  └ owner:  rwx</code></pre><p>The first character is the type: <code>-</code> file, <code>d</code> directory, <code>l</code> symbolic link. Then three groups of three: owner, group, others.</p>`},
 {h:'Numbers',html:`<p>read = 4, write = 2, execute = 1. Add them per group of three:</p><ul><li><code>7</code> rwx · <code>6</code> rw- · <code>5</code> r-x · <code>4</code> r-- · <code>0</code> ---</li><li><code>755</code> scripts and directories · <code>644</code> normal files · <code>600</code> private keys and secrets</li></ul><p>On a directory, <em>execute</em> means “may enter it”; <em>read</em> means “may list it”.</p>`},
 {h:'Symbolic mode',html:`<p><code>chmod u+x file</code> adds execute for the user (owner). Letters: <code>u</code> user, <code>g</code> group, <code>o</code> others, <code>a</code> all; operators <code>+</code> <code>-</code> <code>=</code>.</p><div class="callout warn"><strong>Avoid chmod 777.</strong> It lets every account on the machine modify the file. Fix ownership with <code>chown</code> or group membership instead.</div>`},
 {h:'Ownership and sudo',html:`<p><code>sudo chown alice:devs file</code> changes owner and group; only root can give files away. <code>sudo</code> runs one command as root and is logged. Use <code>id</code> to see which groups you are in.</p>`}
 ]},
{id:'L09',cat:'proc',lvl:2,title:'Processes and signals',summary:'See what is running, stop it cleanly, and manage jobs.',
 cmds:['ps','top','htop','kill','pkill','pgrep','jobs','fg','bg','c:signals'],try:['ps aux','ps aux | grep python','kill 2231'],check:['q-ps1','q-kill1','q-kill2','q-jobs1'],
 sections:[
 {h:'Seeing processes',html:`<p><code>ps aux</code> is a snapshot of everything; <code>top</code> (or <code>htop</code>) updates live. Every process has a <strong>PID</strong>. Sort by resource use with <code>ps aux --sort=-%cpu | head</code>.</p>`},
 {h:'Signals',html:`<ul><li><strong>SIGTERM (15)</strong> — the default for <code>kill</code>: “please exit”. The program can save work and clean up.</li><li><strong>SIGKILL (9)</strong> — the kernel stops the process immediately. No cleanup. Last resort.</li><li><strong>SIGHUP (1)</strong> — many daemons reload their configuration.</li><li><strong>SIGINT (2)</strong> — what <kbd>Ctrl</kbd>+<kbd>C</kbd> sends.</li></ul>`},
 {h:'Jobs in your shell',html:`<p>Add <code>&amp;</code> to run a command in the background. <kbd>Ctrl</kbd>+<kbd>Z</kbd> stops the foreground job; <code>jobs</code> lists them; <code>bg</code> resumes one in the background; <code>fg</code> brings it back.</p>`}
 ]},
{id:'L10',cat:'proc',lvl:2,title:'Services with systemd',summary:'Start, stop, enable and inspect services; read their logs.',
 cmds:['systemctl','journalctl'],try:['systemctl status nginx','systemctl status sshd'],check:['q-sysd1','q-sysd2','q-jctl1'],
 sections:[
 {h:'systemctl',html:`<pre><code>systemctl status nginx          # state + last log lines
sudo systemctl restart nginx    # stop then start
sudo systemctl reload nginx     # re-read config, keep running
sudo systemctl enable --now nginx   # start now and at boot</code></pre><p><strong>start</strong> is about now; <strong>enable</strong> is about boot. A service can be enabled but not running, or running but not enabled.</p>`},
 {h:'Logs with journalctl',html:`<pre><code>journalctl -u nginx --since "1 hour ago"
journalctl -u nginx -f      # follow
journalctl -p err -b        # errors this boot</code></pre>`},
 {h:'Not every system uses systemd',html:`<p class="small">Ubuntu, Debian, Fedora, RHEL and Arch all use systemd. Alpine uses OpenRC, and containers usually have no init system at all, so <code>systemctl</code> will not work inside most Docker containers.</p>`}
 ]},
{id:'L11',cat:'net',lvl:2,title:'Networking essentials',summary:'Addresses, routes, ports, DNS, and remote access with ssh.',
 cmds:['ip','ping','ss','curl','wget','ssh','ssh-keygen','scp','c:ports','c:dns'],try:['ip a','ping -c 3 1.1.1.1','ss -tulpn','curl -I https://example.com'],check:['q-net1','q-net2','q-ssh1','q-dns1'],
 sections:[
 {h:'A troubleshooting ladder',html:`<ol><li><code>ip a</code> — do I have an address?</li><li><code>ip r</code> — do I have a default gateway?</li><li><code>ping -c 3 1.1.1.1</code> — can I reach the internet by IP?</li><li><code>ping -c 3 example.com</code> — does name resolution (DNS) work?</li><li><code>curl -I https://example.com</code> — does the service answer?</li></ol><p>Where the ladder breaks tells you where the problem is.</p>`},
 {h:'Ports',html:`<p>An IP address identifies a machine; a <strong>port</strong> identifies a service on it. Common ones: 22 ssh, 80 http, 443 https, 53 dns. <code>sudo ss -tulpn</code> lists listening ports and the process behind each (<code>ss</code> replaces <code>netstat</code>).</p>`},
 {h:'ssh',html:`<pre><code>ssh-keygen -t ed25519          # once, on your machine
ssh-copy-id admin@server       # install your public key
ssh admin@server               # log in
ssh -p 2222 admin@server       # non-standard port
scp file.txt admin@server:/tmp/</code></pre><p>Keep the private key private: <code>chmod 600</code>. ssh refuses keys that others can read.</p>`}
 ]},
{id:'L12',cat:'storage',lvl:2,title:'Disks and space',summary:'Which disk is full (df), what is filling it (du), and mounting.',
 cmds:['df','du','lsblk','mount','umount'],try:['df -h','du -sh /var/*','du -sh /var/* | sort -h'],check:['q-df1','q-du1','q-mnt1'],
 sections:[
 {h:'df then du',html:`<p><code>df -h</code> answers “which filesystem is full?”. <code>du -sh dir/*</code> answers “what inside is big?”. Add <code>| sort -h</code> to rank, and drill down one directory at a time.</p>`},
 {h:'Block devices and mounts',html:`<p><code>lsblk</code> shows disks (<code>sda</code>, <code>nvme0n1</code>) and partitions. <code>sudo mount /dev/sdb1 /mnt/data</code> attaches a partition to a directory; <code>sudo umount /mnt/data</code> (no “n”) detaches it. Permanent mounts are listed in <code>/etc/fstab</code>.</p>`}
 ]},
{id:'L13',cat:'archive',lvl:2,title:'Archives and compression',summary:'tar, gzip and zip — create, list, extract.',
 cmds:['tar','gzip','gunzip','zip','unzip'],try:[],check:['q-tar1','q-tar2','q-gz1'],
 sections:[
 {h:'tar',html:`<pre><code>tar -czf backup.tar.gz dir/     # create, gzip, file
tar -tzf backup.tar.gz          # list contents
tar -xzf backup.tar.gz -C /tmp  # extract into /tmp</code></pre><p>c create · x extract · t list · z gzip · v verbose · f file name. Put <code>f</code> last in a group because the archive name follows it.</p>`},
 {h:'gzip and zip',html:`<p><code>gzip file</code> compresses one file and <em>replaces</em> it with <code>file.gz</code> (<code>-k</code> keeps the original). Use <code>zip -r</code> when sharing with Windows or macOS users.</p>`}
 ]},
{id:'L14',cat:'pkg',lvl:1,title:'Installing software',summary:'Package managers by distribution: apt, dnf, pacman.',
 cmds:['apt','dnf','pacman'],try:[],check:['q-pkg1','q-pkg2'],
 sections:[
 {h:'Same idea, different tools',html:`<div class="distro"><div data-d="apt"><b>Debian / Ubuntu</b><pre><code>sudo apt update
sudo apt upgrade
sudo apt install nginx</code></pre></div><div data-d="dnf"><b>Fedora / RHEL</b><pre><code>sudo dnf upgrade
sudo dnf install nginx</code></pre></div><div data-d="pacman"><b>Arch</b><pre><code>sudo pacman -Syu
sudo pacman -S nginx</code></pre></div></div><p><code>apt update</code> only refreshes the list of available versions; <code>apt upgrade</code> installs them. dnf refreshes metadata by itself.</p>`},
 {h:'Package names differ too',html:`<p>Apache is <code>apache2</code> on Debian/Ubuntu and <code>httpd</code> on Fedora/RHEL. Search first: <code>apt search</code>, <code>dnf search</code>, <code>pacman -Ss</code>.</p>`}

{id:'L15',cat:'shell',lvl:2,title:'Shell scripting basics',summary:'Variables, exit codes, conditionals, loops, functions and command substitution.',
 cmds:['bash','export','env','which','c:vars','c:exit','c:control','c:subst'],try:['echo $HOME','NAME=Grid','echo "Hello $NAME"','echo $?'],check:['q-var1','q-exit1','q-subst1','q-loop1','q-quote1'],
 sections:[
 {h:'A first script',html:`<pre><code>#!/bin/bash
# backup.sh — archive a folder with today's date
set -euo pipefail
src="$1"
dest="/backups/$(basename "$src")-$(date +%F).tar.gz"
tar -czf "$dest" "$src"
echo "Saved $dest"</code></pre><p>The first line (the <em>shebang</em>) picks the interpreter. <code>chmod +x backup.sh</code>, then run <code>./backup.sh ~/projects</code>. <code>set -euo pipefail</code> stops the script on errors instead of carrying on.</p>`},
 {h:'Variables and quoting',html:`<p><code>name=value</code> — no spaces around <code>=</code>. Read with <code>$name</code>. Always quote: <code>"$file"</code>, or file names containing spaces break into several words. Single quotes stop expansion: <code>'$HOME'</code> is literal text. <code>export</code> passes a variable to programs you launch.</p>`},
 {h:'Exit codes and conditionals',html:`<p>Every command returns an exit code: <code>0</code> success, anything else failure. <code>$?</code> holds the last one.</p><pre><code>if grep -q "error" app.log; then
  echo "errors found"
fi
[ -f /etc/app.conf ] &amp;&amp; echo "config exists"
command || echo "it failed"</code></pre>`},
 {h:'Loops and functions',html:`<pre><code>for f in *.log; do
  gzip "$f"
done

count_lines() { wc -l &lt; "$1"; }
count_lines app.log</code></pre><p><code>$(command)</code> is <strong>command substitution</strong>: its output is pasted into the line, as in <code>today=$(date +%F)</code>.</p>`}
 ]},
{id:'L16',cat:'adv',lvl:3,title:'Scheduling and system health',summary:'cron syntax, logs, memory and load.',
 cmds:['crontab','journalctl','free','uptime','c:cron'],try:['free -h','uptime'],check:['q-cron1','q-cron2','q-free1','q-load1'],
 sections:[
 {h:'cron',html:`<pre><code># ┌ minute (0-59)
# │ ┌ hour (0-23)
# │ │ ┌ day of month (1-31)
# │ │ │ ┌ month (1-12)
# │ │ │ │ ┌ day of week (0-7, 0 and 7 = Sunday)
  30 2 * * *  /usr/local/bin/backup.sh
  */15 * * * * /usr/local/bin/check.sh     # every 15 minutes
  0 9 * * 1-5  /usr/local/bin/report.sh    # 09:00 weekdays</code></pre><p>Edit with <code>crontab -e</code>. Cron runs with a minimal environment: use full paths and redirect output to a log.</p><div class="callout warn"><strong>crontab -r</strong> deletes every job with no confirmation.</div>`},
 {h:'Health at a glance',html:`<ul><li><code>uptime</code> — load average; compare with the number of cores (<code>nproc</code>)</li><li><code>free -h</code> — read the <em>available</em> column, not <em>free</em></li><li><code>df -h</code> — disk space</li><li><code>journalctl -p err -b</code> — errors since boot</li></ul>`}
 ]}
];

/dev/sdb1       200G   61G  129G  33% /srv/data`,hint:'Which command reports used and available space per mounted filesystem?',why:'df confirms it is / (on /dev/sda1) — not the big data disk.'},
 {p:'Find which top-level directory on / is largest. Stay on this filesystem.',a:['%sdu -x?h -d ?1 / [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?h --max-depth=1 / [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?sh /[*] [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?h -d ?1 / 2> ?/dev/null [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?sh /[*] 2> ?/dev/null [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?hd ?1 / [|] sort -h( [|] tail( -n ?[0-9]+)?)?'],s:'sudo du -xh -d1 / | sort -h',it:['du','sort'],
  traps:[{re:'^%sdu -x?s?h? ?/?$',msg:'That gives one grand total. You need a per-directory breakdown — try -d 1 (or /*) and sort it.'},{re:'find ',msg:'find can do this, but du is built for totals. Try du with a depth of 1, sorted.'}],
  out:`12K     /mnt
1.1G    /home
3.9G    /usr
33G     /var
39G     /`,hint:'du summarises space; limit depth to 1 and pipe into sort -h.',why:'-x keeps du on one filesystem so /srv/data is not counted; sort -h ranks sizes like 3.9G and 33G correctly.'},
 {p:'Drill into /var the same way.',a:['%sdu -x?h -d ?1 /var/? [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?sh /var/[*] [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?h --max-depth=1 /var/? [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?sh /var/[*] 2> ?/dev/null [|] sort -h( [|] tail( -n ?[0-9]+)?)?','%sdu -x?hd ?1 /var/? [|] sort -h( [|] tail( -n ?[0-9]+)?)?'],s:'sudo du -sh /var/* | sort -h',it:['du'],
  out:`4.0K    /var/tmp
410M    /var/cache
1.6G    /var/lib
31G     /var/log`,hint:'Repeat the previous command, pointed at /var.',why:'Drilling down one level at a time finds the culprit quickly: /var/log.'},
 {p:'List the files in /var/log/app, largest first, with readable sizes.',a:['%sls -(lhS|lSh|hlS|hSl|Slh|Shl) /var/log/app/?','%sls -l -h -S /var/log/app/?','%sdu -sh /var/log/app/[*] [|] sort -h','%sls -(lahS|alhS|laSh|lhSa|lSah) /var/log/app/?','%sdu -ah /var/log/app/? [|] sort -h'],s:'ls -lhS /var/log/app',it:['ls','du'],
  out:`total 30G
-rw-r--r-- 1 app app  29G Mar  5 14:02 debug.log
-rw-r--r-- 1 app app 180M Mar  5 14:02 app.log
-rw-r--r-- 1 app app  41M Mar  4 23:59 app.log.1.gz`,hint:'ls can sort by size with a capital S.',why:'debug.log is 29 GB — debug logging was probably left on.'},
 {p:'The app still has debug.log open. Empty the file safely so the space is released immediately.',a:['%struncate -s ?0 /var/log/app/debug[.]log','%s: ?> ?/var/log/app/debug[.]log','%s> ?/var/log/app/debug[.]log','sudo sh -c %q: ?> ?/var/log/app/debug[.]log%q','sudo sh -c %q> ?/var/log/app/debug[.]log%q','sudo truncate --size[= ]0 /var/log/app/debug[.]log'],s:'sudo truncate -s 0 /var/log/app/debug.log',it:['c:redirect'],
  traps:[{re:'rm ',msg:'Careful: if you rm a file a process still has open, the name disappears but the space is NOT freed until the process closes it. Empty the file in place instead (truncate -s 0).'},{re:'gzip',msg:'gzip writes a new compressed copy first — with 1.2 GB free, compressing a 29 GB file can fill the disk completely. Empty it in place first.'}],
  out:`$ df -h /
Filesystem      Size  Used Avail Use% Mounted on
/dev/sda1        40G   10G   30G  25% /`,hint:'truncate -s 0 sets a file’s size to zero without deleting it.',why:'Truncating keeps the same file (and the app’s open handle) but releases the blocks. Next: turn off debug logging and make sure logrotate covers /var/log/app.'}
 ],
 debrief:'Pattern: df (which disk) → du -xh -d1 | sort -h (which directory, repeat) → ls -lhS (which file) → fix safely. Deleting an open file does not free space; truncating does. Afterwards, fix the cause (debug logging) and add log rotation.'},
{id:'s-cpu',title:'A process is eating the CPU',cat:'proc',d:2,host:'app02',
 brief:'app02 is sluggish and the fans are loud. Identify the process using the CPU, find out what it is, and stop it cleanly.',
 steps:[
 {p:'Get a snapshot of processes sorted by CPU usage.',a:['ps aux --sort=-%cpu( [|] head( -n ?[0-9]+)?)?','ps -eo [a-z,%]+ --sort=-%cpu( [|] head( -n ?[0-9]+)?)?','ps aux [|] sort -(rnk|nrk|k) ?3( -rn| -nr)?( [|] head( -n ?[0-9]+)?)?','top( -b -n ?1)?( [|] head( -n ?[0-9]+)?)?','htop'],s:'ps aux --sort=-%cpu | head',it:['ps','top'],
  out:`USER    PID %CPU %MEM    VSZ   RSS TTY  STAT START   TIME COMMAND
bob    3127 98.7  2.1 412332 84112 ?    R    09:14  52:31 python3 /home/bob/report.py
mysql   912  4.2 18.3 2.1g   742m  ?    Ssl  Mar01 210:07 /usr/sbin/mysqld
root      1  0.0  0.1 167852 11232 ?    Ss   Mar01   0:09 /sbin/init`,hint:'ps aux can sort with --sort=-%cpu; or use top.',why:'PID 3127, owned by bob, has used 98.7% CPU for almost an hour.'},
 {p:'Show more about PID 3127: its full command, parent and how long it has run.',a:['ps -fp ?3127','ps -f -p ?3127','ps -p ?3127 -o [a-z,%]+','ps -o [a-z,%]+ -p ?3127','ps -[a-z]*p ?3127','ls -l /proc/3127/cwd','cat /proc/3127/cmdline','ps aux [|] grep 3127'],s:'ps -fp 3127',it:['ps'],
  out:`UID    PID  PPID  C STIME TTY          TIME CMD
bob   3127  3099 98 09:14 ?        00:52:31 python3 /home/bob/report.py --year all`,hint:'ps -p selects one PID; -f adds the parent PID and full command.',why:'A report script run with --year all — likely a runaway job, not an attack. Checking before killing avoids stopping something important.'},
 {p:'Ask the process to terminate cleanly.',a:['%skill 3127','%skill -15 3127','%skill -TERM 3127','%skill -SIGTERM 3127'],s:'sudo kill 3127',it:['kill','c:signals'],
  traps:[{re:'kill -9',msg:'SIGKILL works, but skips cleanup (temp files, partial output). Try the default SIGTERM first.'},{re:'pkill',msg:'pkill by name could hit other python3 processes. You have the exact PID — use it.'}],
  out:'',hint:'The default signal of kill is the polite one.',why:'SIGTERM lets Python run its cleanup handlers.'},
 {p:'Verify the process is gone.',a:['ps -p ?3127','ps -fp ?3127','ps aux [|] grep 3127','pgrep -f report[.]py','ps aux --sort=-%cpu( [|] head( -n ?[0-9]+)?)?','ps aux [|] grep report'],s:'ps -p 3127',it:['ps'],
  out:`    PID TTY          TIME CMD`,hint:'Check the same PID again.',why:'Only the header prints: 3127 exited. If it had survived, kill -9 would be the next step.'}
 ],
 debrief:'Find (ps --sort / top) → identify (ps -fp) → SIGTERM → verify → only then SIGKILL. Then talk to the owner: the script needs limits or a schedule outside business hours.'},
{id:'s-perm',title:'Access denied to a shared file',cat:'perm',d:2,host:'files01',
 brief:'Alice in Finance reports “Permission denied” when opening /srv/reports/q3.txt. Finance should be able to read it; nobody else should.',
 steps:[
 {p:'Look at the file’s permissions and ownership.',a:['ls -l /srv/reports/q3[.]txt','ls -la /srv/reports/q3[.]txt','ls -l /srv/reports/?','ls -la /srv/reports/?','stat /srv/reports/q3[.]txt'],s:'ls -l /srv/reports/q3.txt',it:['ls','c:permbits'],
  out:`-rw------- 1 root root 18432 Mar  5 08:30 /srv/reports/q3.txt`,hint:'The long listing shows permissions, owner and group.',why:'Owned by root:root with mode 600 — only root can read it.'},
 {p:'Check which groups alice belongs to.',a:['id alice','groups alice','id -nG alice'],s:'id alice',it:['id'],
  out:`uid=1003(alice) gid=1003(alice) groups=1003(alice),1010(finance)`,hint:'One command prints a user’s uid, gid and groups.',why:'alice is in finance. Giving the finance group read access is the least-privilege fix.'},
 {p:'Change the file’s group to finance.',a:['sudo chgrp finance /srv/reports/q3[.]txt','sudo chown :finance /srv/reports/q3[.]txt','sudo chown root:finance /srv/reports/q3[.]txt'],s:'sudo chgrp finance /srv/reports/q3.txt',it:['chgrp','chown'],
  traps:[{re:'chown alice',msg:'Making alice the owner works for her alone; the next Finance hire hits the same wall. Use the group.'}],
  out:'',hint:'chgrp, or chown with :group.',why:'The group now matches the team that needs access.'},
 {p:'Give the group read permission; keep others out (owner rw, group r, others none).',a:['sudo chmod 640 /srv/reports/q3[.]txt','sudo chmod g[+]r /srv/reports/q3[.]txt','sudo chmod u=rw,g=r,o= /srv/reports/q3[.]txt','sudo chmod u=rw,g=r,o=- /srv/reports/q3[.]txt'],s:'sudo chmod 640 /srv/reports/q3.txt',it:['chmod','c:permbits'],
  traps:[{re:'777|666|644|o[+]r|a[+]r',msg:'That lets everyone on the system read financial data. Only the group should gain access.'}],
  out:`$ ls -l /srv/reports/q3.txt
-rw-r----- 1 root finance 18432 Mar  5 08:30 /srv/reports/q3.txt`,hint:'6 = rw, 4 = r, 0 = none.',why:'640 → root can edit, finance can read, everyone else is denied.'}
 ],
 debrief:'Diagnose with ls -l and id before changing anything. Prefer group access over changing ownership to an individual, and never widen to “others” for sensitive data. Also check that alice can enter /srv/reports (x on the directory).'},
{id:'s-svc',title:'The web service will not start',cat:'proc',d:3,host:'web03',
 brief:'After a colleague edited the nginx configuration, the website is down. Find out why and bring it back.',
 steps:[
 {p:'Check the state of the nginx service.',a:['%ssystemctl status nginx([.]service)?','%ssystemctl is-active nginx'],s:'systemctl status nginx',it:['systemctl'],
  out:`× nginx.service - A high performance web server
     Loaded: loaded (/lib/systemd/system/nginx.service; enabled)
     Active: failed (Result: exit-code) since Thu 2026-03-05 10:02:11 UTC
    Process: 4412 ExecStartPre=/usr/sbin/nginx -t (code=exited, status=1/FAILURE)`,hint:'systemctl has a subcommand that reports state and recent logs.',why:'The pre-start config test (nginx -t) failed, so nginx never started.'},
 {p:'Read the recent log entries for the nginx unit.',a:['%sjournalctl -u nginx([.]service)?( -n ?[0-9]+| -e| -xe| --since .+| -b| --no-pager)*','%sjournalctl -xeu nginx([.]service)?','%sjournalctl -eu nginx([.]service)?'],s:'journalctl -u nginx -n 20',it:['journalctl'],
  out:`Mar 05 10:02:11 web03 nginx[4412]: nginx: [emerg] unknown directive "lsten" in /etc/nginx/sites-enabled/shop:3
Mar 05 10:02:11 web03 nginx[4412]: nginx: configuration file /etc/nginx/nginx.conf test failed
Mar 05 10:02:11 web03 systemd[1]: nginx.service: Control process exited, code=exited, status=1/FAILURE`,hint:'journalctl filters by unit with -u.',why:'A typo: "lsten" instead of "listen" on line 3 of sites-enabled/shop.'},
 {p:'Fix the typo in /etc/nginx/sites-enabled/shop (use sed, or open an editor).',a:["sudo sed -i(\\.bak)? %qs/lsten/listen/g?%q /etc/nginx/sites-enabled/shop","sudo (nano|vim?|vi) /etc/nginx/sites-enabled/shop","sudoedit /etc/nginx/sites-enabled/shop"],s:"sudo sed -i 's/lsten/listen/' /etc/nginx/sites-enabled/shop",it:['sed'],
  out:'(file updated: line 3 now reads "listen 80;")',hint:"sed -i 's/old/new/' file edits in place; or sudo nano the file.",why:'The directive is corrected. The config is in /etc, so sudo is needed.'},
 {p:'Test the nginx configuration before restarting.',a:['sudo nginx -t','sudo /usr/sbin/nginx -t','nginx -t'],s:'sudo nginx -t',it:['c:exit'],
  out:`nginx: the configuration file /etc/nginx/nginx.conf syntax is ok
nginx: configuration file /etc/nginx/nginx.conf test is successful`,hint:'nginx has a -t flag to validate its config.',why:'Testing first means a restart cannot fail on the same mistake. apachectl configtest, sshd -t and named-checkconf do the same for other daemons.'},
 {p:'Start the service again.',a:['sudo systemctl (re)?start nginx([.]service)?'],s:'sudo systemctl restart nginx',it:['systemctl'],
  out:`$ systemctl is-active nginx
active`,hint:'Use systemctl with start or restart.',why:'nginx is running. Confirm with curl -I http://localhost.'}
 ],
 debrief:'status → journalctl -u → fix → config test → restart → verify. Always validate a config before restarting a production service.'},
{id:'s-find',title:'Where is that config file?',cat:'nav',d:1,host:'lamp01',
 brief:'You must raise PHP’s memory_limit, but you do not know where php.ini lives on this server.',
 steps:[
 {p:'Search the whole filesystem for files named php.ini, hiding permission errors.',a:['%sfind / -name %qphp[.]ini%q( -type f)? 2> ?/dev/null','%sfind / -type f -name %qphp[.]ini%q 2> ?/dev/null','%sfind / -iname %qphp[.]ini%q 2> ?/dev/null','%slocate php[.]ini','%sfind / -name %qphp[.]ini%q'],s:'sudo find / -name php.ini 2>/dev/null',it:['find','locate','c:redirect'],
  out:`/etc/php/8.3/cli/php.ini
/etc/php/8.3/fpm/php.ini`,hint:'find with -name; send errors to /dev/null with 2>.',why:'Two copies: one for the command line (cli) and one for the web server (fpm).'},
 {p:'Show the memory_limit line and its line number in the FPM (web) copy.',a:['%sgrep -n %q?memory_limit%q? /etc/php/8[.]3/fpm/php[.]ini','%sgrep -in %q?memory_limit%q? /etc/php/8[.]3/fpm/php[.]ini','%sgrep -ni %q?memory_limit%q? /etc/php/8[.]3/fpm/php[.]ini'],s:'grep -n memory_limit /etc/php/8.3/fpm/php.ini',it:['grep'],
  traps:[{re:'cli',msg:'The cli copy only affects php run from the terminal. Web requests use the fpm copy.'}],
  out:`435:memory_limit = 128M`,hint:'grep -n prints line numbers.',why:'Line 435. Edit it, then reload php-fpm for the change to take effect.'}
 ],
 debrief:'find walks the live filesystem (2>/dev/null hides noise); locate is faster but needs an up-to-date index. Many programs have separate configs per context — check which one the service actually loads.'},
{id:'s-ssh',title:'Secure access to a new server',cat:'net',d:2,host:'laptop',
 brief:'You have been given admin@203.0.113.10 with a temporary password. Set up key-based login so you can stop using the password.',
 steps:[
 {p:'Generate a modern SSH key pair on your own machine.',a:['ssh-keygen( -t ed25519)?( -C .+)?','ssh-keygen -t ed25519 -a ?[0-9]+( -C .+)?'],s:'ssh-keygen -t ed25519',it:['ssh-keygen'],
  out:`Generating public/private ed25519 key pair.
Your identification has been saved in /home/student/.ssh/id_ed25519
Your public key has been saved in /home/student/.ssh/id_ed25519.pub`,hint:'ssh-keygen with -t ed25519.',why:'The private key stays on your laptop; only the .pub file will be copied.'},
 {p:'Install your public key on the server.',a:['ssh-copy-id (-i \\S+ )?admin@203[.]0[.]113[.]10'],s:'ssh-copy-id admin@203.0.113.10',it:['ssh'],
  traps:[{re:'^scp',msg:'scp could copy the file, but you would still need to append it to ~/.ssh/authorized_keys with the right permissions. ssh-copy-id does all of that.'}],
  out:`Number of key(s) added: 1
Now try logging into the machine, with: "ssh 'admin@203.0.113.10'"`,hint:'There is a helper named ssh-copy-id.',why:'It appends your key to ~/.ssh/authorized_keys on the server and fixes permissions.'},
 {p:'Log in using the key.',a:['ssh admin@203[.]0[.]113[.]10','ssh -i ~/[.]ssh/id_ed25519 admin@203[.]0[.]113[.]10','ssh -l admin 203[.]0[.]113[.]10'],s:'ssh admin@203.0.113.10',it:['ssh'],
  out:`Welcome to Ubuntu 24.04 LTS
admin@srv:~$`,hint:'Plain ssh user@host.',why:'No password prompt — the key was used. Next hardening step: set PasswordAuthentication no in /etc/ssh/sshd_config and reload ssh, keeping this session open until you confirm a new login works.'}
 ],
 debrief:'ssh-keygen → ssh-copy-id → ssh. Keep private keys at mode 600, and never disable password login until key login is proven in a second session.'},
{id:'s-net',title:'Websites will not load',cat:'net',d:2,host:'desk07',
 brief:'A user on desk07 says “the internet is down”. Work up the network ladder to find where it breaks.',
 steps:[
 {p:'Check whether the machine has an IP address.',a:['ip a(ddr)?( show)?','ip address( show)?','ip -4 a(ddr)?','ip -br a(ddr)?'],s:'ip a',it:['ip'],
  out:`2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500
    inet 192.168.10.57/24 brd 192.168.10.255 scope global eth0`,hint:'The ip command, with the address object.',why:'eth0 is up with 192.168.10.57 — layer 1–3 on the local link look fine.'},
 {p:'Test raw internet connectivity by IP address (send 3 packets).',a:['ping -c ?3 (1[.]1[.]1[.]1|8[.]8[.]8[.]8|9[.]9[.]9[.]9)','ping -c ?[0-9]+ (1[.]1[.]1[.]1|8[.]8[.]8[.]8|9[.]9[.]9[.]9)'],s:'ping -c 3 1.1.1.1',it:['ping'],
  out:`3 packets transmitted, 3 received, 0% packet loss, time 2003ms
rtt min/avg/max/mdev = 11.2/11.9/12.8/0.6 ms`,hint:'Ping a well-known public IP such as 1.1.1.1, with -c to limit the count.',why:'The route to the internet works.'},
 {p:'Now test by name: ping example.com three times.',a:['ping -c ?[0-9]+ example[.]com'],s:'ping -c 3 example.com',it:['ping','c:dns'],
  out:`ping: example.com: Temporary failure in name resolution`,hint:'Same command, a host name instead of an IP.',why:'IP works, names do not: this is DNS.'},
 {p:'Inspect which DNS server the machine is configured to use.',a:['cat /etc/resolv[.]conf','resolvectl( status)?','systemd-resolve --status','less /etc/resolv[.]conf','nmcli dev show( eth0)?'],s:'cat /etc/resolv.conf',it:['cat','c:dns'],
  out:`nameserver 10.0.0.99`,hint:'Resolver settings live in /etc/resolv.conf (or ask resolvectl).',why:'10.0.0.99 is not on this 192.168.10.0/24 network — a stale DNS setting. Fix it in the network configuration (NetworkManager, netplan or systemd-resolved), not by hand-editing a generated resolv.conf.'}
 ],
 debrief:'The ladder — address → gateway → ping IP → ping name → service — tells you which layer failed. Here: DNS.'},
{id:'s-port',title:'Port 80 is already taken',cat:'net',d:3,host:'web05',
 brief:'You installed nginx, but it will not start: “bind() to 0.0.0.0:80 failed (98: Address already in use)”. Find what holds port 80 and resolve it.',
 steps:[
 {p:'Find the process listening on TCP port 80.',a:['sudo ss -[tlpn]{4}( [|] grep %q?:80%q?)?','sudo ss -[tulpn]{5}( [|] grep %q?:80%q?)?','sudo ss -[tlpn]{4} %q?sport = :80%q?','sudo lsof -i ?:80','sudo netstat -[tlpn]{4}( [|] grep %q?:80%q?)?','sudo fuser 80/tcp'],s:'sudo ss -tlpn | grep :80',it:['ss','c:ports'],
  traps:[{re:'^ss ',msg:'Without sudo, ss cannot show which process owns a socket that belongs to another user. Add sudo.'}],
  out:`LISTEN 0 511 0.0.0.0:80 0.0.0.0:* users:(("apache2",pid=1204,fd=4))`,hint:'ss with -t -l -p -n, filtered for :80 — needs sudo to see process names.',why:'Apache (apache2) is already bound to port 80.'},
 {p:'Stop Apache now.',a:['sudo systemctl stop apache2([.]service)?'],s:'sudo systemctl stop apache2',it:['systemctl'],
  traps:[{re:'kill',msg:'Killing the PID works until systemd restarts it or the next reboot. Manage services through systemctl.'}],
  out:'',hint:'systemctl stop …',why:'Port 80 is free now.'},
 {p:'Prevent Apache from starting at boot.',a:['sudo systemctl disable apache2([.]service)?','sudo systemctl mask apache2([.]service)?'],s:'sudo systemctl disable apache2',it:['systemctl'],
  out:`Removed "/etc/systemd/system/multi-user.target.wants/apache2.service".`,hint:'The opposite of enable.',why:'Otherwise the conflict returns after the next reboot. (Or remove the package if it is not needed.)'},
 {p:'Start nginx and make sure it starts at boot.',a:['sudo systemctl enable --now nginx([.]service)?','sudo systemctl start nginx([.]service)?','sudo systemctl restart nginx([.]service)?'],s:'sudo systemctl enable --now nginx',it:['systemctl'],
  out:`$ systemctl is-active nginx
active`,hint:'enable --now does both in one command.',why:'nginx now owns port 80.'}
 ],
 debrief:'“Address already in use” → sudo ss -tlpn to find the owner → stop and disable the conflicting service → start the one you want.'}
];

/* Boss chains for the game: multi-step incidents. */
const BOSSES = [
 {name:'Disk-eater daemon',steps:[
  {p:'Which filesystem is full? (human-readable)',a:['%sdf -h'],s:'df -h',it:['df'],d:1},
  {p:'Size of each item in /var, sorted',a:['%sdu -sh /var/[*] [|] sort -h','%sdu -h -d ?1 /var [|] sort -h'],s:'du -sh /var/* | sort -h',it:['du','sort'],d:2},
  {p:'Empty /var/log/big.log in place',a:['%struncate -s ?0 /var/log/big[.]log','%s: ?> ?/var/log/big[.]log','%s> ?/var/log/big[.]log'],s:'truncate -s 0 /var/log/big.log',it:['c:redirect'],d:3}]},
 {name:'Runaway process',steps:[
  {p:'Processes sorted by CPU, highest first',a:['ps aux --sort=-%cpu( [|] head( -n ?[0-9]+)?)?','top'],s:'ps aux --sort=-%cpu | head',it:['ps'],d:2},

 {name:'Locked vault',steps:[
  {p:'Show permissions of vault.key',a:['ls -l (./)?vault[.]key','ls -la (./)?vault[.]key'],s:'ls -l vault.key',it:['ls'],d:1},
  {p:'Give vault.key to user sam',a:['sudo chown sam (./)?vault[.]key'],s:'sudo chown sam vault.key',it:['chown'],d:2},

 {name:'Dead service',steps:[
  {p:'State of the sshd service',a:['%ssystemctl status sshd?([.]service)?'],s:'systemctl status sshd',it:['systemctl'],d:1},
  {p:'Last logs for unit sshd',a:['%sjournalctl -u sshd?([.]service)?( -n ?[0-9]+| -e| -xe| -b)*','%sjournalctl -xeu sshd?'],s:'journalctl -u sshd',it:['journalctl'],d:2},
  {p:'Start sshd now and at every boot',a:['sudo systemctl enable --now sshd?([.]service)?'],s:'sudo systemctl enable --now sshd',it:['systemctl'],d:2}]}
];

/* Terminal challenges: goal + check(fs, sh) against the simulated system. */
const CHALLENGES = [
