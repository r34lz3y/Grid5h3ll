/* ---- 20-engine.js ---- */
/* =====================================================================
   UTIL
   ===================================================================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* `code` → <code>; everything else escaped */
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const DAY = 864e5;
const today = (t=Date.now()) => { const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const pct = v => Math.round(v*100);
const relTime = t => { const s=(Date.now()-t)/1000; if(s<60) return 'now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
const fmtDur = ms => { const m=Math.round(ms/60000); return m<60? m+' min' : (m/60).toFixed(1)+' h'; };
function weightedPick(list, wfn){ const ws=list.map(wfn); const tot=ws.reduce((a,b)=>a+b,0); if(!tot) return pick(list); let r=Math.random()*tot; for(let i=0;i<list.length;i++){ r-=ws[i]; if(r<=0) return list[i]; } return list[list.length-1]; }

/* ---------- answer matching ---------- */
const RX_CACHE = new Map();
function compileRx(p, anchored=true){
  const key = p + anchored;
  if(!RX_CACHE.has(key)){
    const src = p.replace(/%s/g,'(sudo )?').replace(/%q/g,`["']?`);
    RX_CACHE.set(key, new RegExp(anchored ? '^(?:'+src+')$' : src));
  }
  return RX_CACHE.get(key);
}
const normCmd = s => String(s).trim().replace(/\s+/g,' ').replace(/\s*;$/,'').replace(/\s*\|\s*/g,' | ').replace(/\s*&&\s*/g,' && ');
function matchAnswer(input, patterns, sample){
  const variants = [...new Set([String(input).trim().replace(/\s+/g,' ').replace(/\s*;$/,''), normCmd(input)])];
  if(sample && variants.includes(normCmd(sample))) return true;
  return patterns.some(p => variants.some(v => compileRx(p).test(v)));
}
function matchTrap(input, traps){ const v = normCmd(input); return (traps||[]).find(t => compileRx(t.re,false).test(v)); }

/* =====================================================================
   STORE · persistence behind a tiny adapter so a cloud adapter
   (same load/save shape) can replace localStorage later.
   ===================================================================== */
const STORE_KEY = 'gridshell.v1';
const LocalAdapter = {
  load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){ return null; } },
  save(data){ try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; } catch(e){ return false; } }
};
const MemoryAdapter = { _d:null, load(){ return this._d; }, save(d){ this._d = JSON.parse(JSON.stringify(d)); return true; } };
function storageAvailable(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } }

const Store = {
  adapter: storageAvailable() ? LocalAdapter : MemoryAdapter,
  data: null, _t: null,
  blank(){ return { schema:1, created:Date.now(), updated:Date.now(), xp:0,
    settings:{theme:'grid', distro:'apt', scale:1, reduceMotion:false},
    items:{}, lessons:{}, qlog:[], daily:{}, scen:{}, chal:{}, game:{hs:[],runs:0,best:0,bestWave:0,maxCombo:0},
    ach:{}, activity:[], time:{}, bestRun:0, run:0, rmAck:false }; },
  load(){ const d = this.adapter.load(); this.data = this.migrate(d) || this.blank(); return this.data; },
  migrate(d){ if(!d || typeof d!=='object' || !d.schema) return null; const b=this.blank(); for(const k in b) if(!(k in d)) d[k]=b[k]; d.settings={...b.settings,...d.settings}; d.game={...b.game,...d.game}; return d; },
  save(){ clearTimeout(this._t); this._t = setTimeout(()=>this.flush(), 250); },
  flush(){ clearTimeout(this._t); this.data.updated = Date.now(); this.adapter.save(this.data); },
  exportJSON(){ return JSON.stringify({app:'gridshell', exported:new Date().toISOString(), data:this.data}, null, 2); },
  importJSON(text){ const o = JSON.parse(text); const d = this.migrate(o.data || o); if(!d) throw new Error('This file is not a Grid5h3LL progress export.'); this.data = d; this.flush(); },
  reset(){ this.data = this.blank(); this.flush(); }
};

/* =====================================================================
   CONTENT INDEX
   ===================================================================== */
const CMD = Object.fromEntries(COMMANDS.map(c => [c.n, c]));
const CONCEPT = Object.fromEntries(CONCEPTS.map(c => [c.id, c]));
const ITEM_IDS = [...COMMANDS.map(c=>c.n), ...CONCEPTS.map(c=>c.id)];
const itemName = id => id.startsWith('c:') ? (CONCEPT[id]?.name || id) : id;
const itemCat = id => id.startsWith('c:') ? CONCEPT[id]?.cat : CMD[id]?.c;
const CAT = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
const QBYID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const STAGES = ['Not started','Introduced','Practiced','Competent','Mastered'];
const LEVELS = [
  {name:'Beginner', min:0},
  {name:'Novice', min:.10},
  {name:'Intermediate', min:.25},
  {name:'Advanced', min:.50},
  {name:'Expert', min:.75, scen:6}
];

/* =====================================================================
   ENGINE · mastery, spaced review, adaptive selection, generation
   ===================================================================== */
const Engine = {
  it(id){ const s=Store.data.items; if(!s[id]) s[id]={a:0,c:0,h:[],ty:{},days:[],ease:2.3,iv:0,due:0,last:0,intro:0,used:0,flag:false}; return s[id]; },
  peek(id){ return Store.data.items[id]; },
  recentAcc(r){ return r && r.h.length ? r.h.reduce((a,b)=>a+b,0)/r.h.length : 0; },

  stage(id){
    const r = this.peek(id); if(!r) return 0;
    if(!r.a) return (r.intro||r.used) ? 1 : 0;
    const acc = this.recentAcc(r), types = Object.keys(r.ty).length;
    if(r.c>=6 && acc>=.85 && types>=2 && r.days.length>=2) return 4;
    if(r.c>=3 && acc>=.7) return 3;
    return 2;
  },
  /* 0..1 score used for percentages and weighting */
  score(id){
    const r = this.peek(id); const st = this.stage(id);
    if(st===0) return 0; if(st===1) return .08; if(st===4) return 1;
    const acc = this.recentAcc(r);
    if(st===2) return .15 + .3*acc*Math.min(1, r.c/3);
    const toward = Math.min(r.c/6, acc/.85, Object.keys(r.ty).length/2, r.days.length/2, 1);
    return .55 + .4*toward;
  },
  overall(){ return ITEM_IDS.reduce((a,id)=>a+this.score(id),0)/ITEM_IDS.length; },
  catItems(cat){ return ITEM_IDS.filter(id => itemCat(id)===cat); },
  catScore(cat){ const ids=this.catItems(cat); return ids.length ? ids.reduce((a,id)=>a+this.score(id),0)/ids.length : 0; },
  level(){
    const m = this.overall(), scen = Object.values(Store.data.scen).filter(s=>s.done).length;
    let i = 0; LEVELS.forEach((L,k)=>{ if(m>=L.min && (!L.scen || scen>=L.scen)) i=k; });
    const next = LEVELS[i+1];
    return {i, name:LEVELS[i].name, m, next, toNext: next ? clamp((m-LEVELS[i].min)/(next.min-LEVELS[i].min),0,1) : 1, scen};
  },
  isDue(id){ const r=this.peek(id); return !!r && r.a>0 && (r.flag || r.due<=Date.now()); },
  dueItems(){ return ITEM_IDS.filter(id=>this.isDue(id)); },
  struggling(){ return ITEM_IDS.filter(id=>{ const r=this.peek(id); return r && r.a>=2 && this.recentAcc(r)<.6; }); },
  related(id){ const c=CMD[id]; const out=new Set(c?.rel||[]); for(const q of QUESTIONS) if(q.it.includes(id)) q.it.forEach(x=>out.add(x)); out.delete(id); return [...out]; },

  introduce(ids){ ids.forEach(id=>{ const r=this.it(id); if(!r.intro) r.intro=Date.now(); }); Store.save(); },
  used(id){ if(!ITEM_IDS.includes(id)) return; const r=this.it(id); r.used++; if(!r.intro) r.intro=Date.now(); },

  /* Record one graded attempt on a set of items. kind = question style (for "types" evidence). */
  record(items, ok, {kind='mc', d=1, qid=null, src='practice', ms=0}={}){
    const now = Date.now(), day = today(now);
    const before = this.level().i;
    const beforeStages = Object.fromEntries(items.map(id=>[id,this.stage(id)]));
    items.forEach(id=>{
      if(!ITEM_IDS.includes(id)) return;
      const r = this.it(id);
      r.a++; if(ok) r.c++;
      r.h.push(ok?1:0); if(r.h.length>10) r.h.shift();
      r.ty[kind] = (r.ty[kind]||0)+1;
      if(!r.days.includes(day)){ r.days.push(day); if(r.days.length>12) r.days.shift(); }
      r.last = now; if(!r.intro) r.intro = now;
      /* SM-2 style interval */
      if(ok){ r.iv = r.iv<1 ? 1 : r.iv<3 ? 3 : Math.round(r.iv*r.ease); r.ease = Math.min(3, r.ease+.05); r.flag=false; }
      else { r.iv = 0; r.ease = Math.max(1.3, r.ease-.2); }
      r.due = ok ? now + r.iv*DAY : now + 10*60*1000;
    });
    const D = Store.data;
    D.qlog.push({t:now, q:qid, it:items, ok:ok?1:0, k:kind, d, src}); if(D.qlog.length>600) D.qlog.splice(0, D.qlog.length-600);
    const g = D.daily[day] || (D.daily[day] = {xp:0,q:0,ok:0,ms:0,m:0});
    g.q++; if(ok) g.ok++;
    D.run = ok ? D.run+1 : 0; D.bestRun = Math.max(D.bestRun, D.run);
    this.xp(ok ? 8+4*d : 2);
    g.m = this.overall();
    items.forEach(id=>{ const a=beforeStages[id], b=this.stage(id); if(b>a && b>=3) this.log(`${itemName(id)} reached ${STAGES[b]}`); });
    const after = this.level();
    if(after.i>before){ this.log(`Level up: ${after.name}`); UI.toast(`Level up — you are now ${after.name}`); }
    Achievements.check();
    Store.save();
  },
  xp(n){ const D=Store.data; D.xp+=n; const g=D.daily[today()]||(D.daily[today()]={xp:0,q:0,ok:0,ms:0,m:this.overall()}); g.xp+=n; },
  log(txt){ const A=Store.data.activity; A.unshift({t:Date.now(), txt}); if(A.length>80) A.length=80; },
  streak(){
    const days = new Set(Object.keys(Store.data.daily).filter(k=>{const g=Store.data.daily[k]; return g.q>0||g.xp>0;}));
    let n=0, t=Date.now(); if(!days.has(today(t))) t-=DAY;
    while(days.has(today(t))){ n++; t-=DAY; }
    return n;
  },

  /* ---------- question generation from the command database ---------- */
  genPurpose(cmd){
    const c = CMD[cmd]; const same = COMMANDS.filter(x=>x.n!==cmd && x.c===c.c); const other = COMMANDS.filter(x=>x.n!==cmd && x.c!==c.c);
    const ds = shuffle(same).slice(0,2).concat(shuffle(other)).filter((x,i,a)=>a.findIndex(y=>y.n===x.n)===i).slice(0,3);
    return {id:'g-p-'+cmd, k:'mc', lab:'Command identification', c:c.c, d:c.l, it:[cmd], gen:true,
      p:`Which command would you use to: ${c.p.replace(/\.$/,'').toLowerCase()}?`,
      o:shuffle([[`\`${cmd}\``,1,`Yes. Syntax: \`${c.s}\``], ...ds.map(x=>[`\`${x.n}\``,0,`${x.n}: ${x.p}`])]),
      ex:c.x, con:CAT[c.c].name, rem:`\`${c.e[0][0]}\` — ${c.e[0][1]}`};
  },
  genOption(cmd){
    const c = CMD[cmd]; const opts = c.o.filter(o=>/^-/.test(o[0])); if(!opts.length) return null;
    const [flag, desc] = pick(opts);
    const others = shuffle(COMMANDS.flatMap(x=>x.o.filter(o=>/^-/.test(o[0]) && o[1]!==desc).map(o=>o[1]))).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
    return {id:`g-o-${cmd}-${flag}`, k:'mc', lab:'Option meaning', c:c.c, d:Math.min(3,c.l+1), it:[cmd], gen:true,
      p:`What does \`${flag.split(' ')[0]}\` do in \`${cmd}\`?`, o:shuffle([[desc,1,'Correct.'], ...others.map(o=>[o,0,'That describes an option of a different command.'])]),
      ex:`${cmd} ${flag}: ${desc}`, con:CAT[c.c].name, rem:`\`${c.s}\``};
  },
  genMatch(cat){
    const pool = shuffle(COMMANDS.filter(c=>c.c===cat)); if(pool.length<3) return null;
    const set = pool.slice(0, Math.min(4, pool.length));
    return {id:'g-m-'+cat+'-'+set.map(s=>s.n).join('.'), k:'match', lab:'Match command to purpose', c:cat, d:1, it:set.map(s=>s.n), gen:true,
      p:'Match each command to what it does.', pairs:set.map(s=>[s.n, s.p]),
      ex:set.map(s=>`\`${s.n}\` — ${s.p}`).join(' '), con:CAT[cat].name, rem:'Knowing the purpose tells you which tool to reach for.'};
  },
  genDrill(dr){ return {id:'g-d-'+dr.s, k:'fill', lab:'Recall the command', c:itemCat(dr.it[0]), d:dr.d, it:dr.it, gen:true, p:dr.p+'.', a:dr.a, s:dr.s,
      ex:`One correct answer: \`${dr.s}\`.`, con:itemName(dr.it[0]), rem:CMD[dr.it[0]] ? `\`${CMD[dr.it[0]].s}\`` : ''}; },

  candidates(){
    const out = [...QUESTIONS];
    COMMANDS.forEach(c=>{ out.push({gen:'p', c:c.c, d:c.l, it:[c.n], id:'g-p-'+c.n}); if(c.o.some(o=>/^-/.test(o[0]))) out.push({gen:'o', c:c.c, d:Math.min(3,c.l+1), it:[c.n], id:'g-o-'+c.n}); });
    DRILLS.forEach((d,i)=>out.push({gen:'d', i, c:itemCat(d.it[0]), d:d.d, it:d.it, id:'g-d-'+d.s}));
    CATEGORIES.forEach(k=>out.push({gen:'m', c:k.id, d:1, it:COMMANDS.filter(c=>c.c===k.id).map(c=>c.n), id:'g-m-'+k.id}));
    return out;
  },
  materialize(c){
    if(!c.gen || c.k) return c;
    if(c.gen==='p') return this.genPurpose(c.it[0]);
    if(c.gen==='o') return this.genOption(c.it[0]) || this.genPurpose(c.it[0]);
    if(c.gen==='d') return this.genDrill(DRILLS[c.i]);
    if(c.gen==='m') return this.genMatch(c.c) || this.genPurpose(pick(c.it));
  },

  /* Adaptive pick. mode: adaptive | review | weak | cat:<id> | item:<id> */
  nextQuestion(mode='adaptive', prev=null, askedIds=new Set()){
    const D = Store.data;
    const recent = new Set(D.qlog.slice(-18).map(l=>l.q));
    const due = new Set(this.dueItems());
    const strug = new Set(this.struggling());
    const strugRel = new Set([...strug].flatMap(id=>this.related(id)));
    const catScores = Object.fromEntries(CATEGORIES.map(c=>[c.id,this.catScore(c.id)]));
    const practicedCats = CATEGORIES.filter(c=>this.catItems(c.id).some(id=>this.peek(id)?.a));
    const weakCats = new Set(practicedCats.sort((a,b)=>catScores[a.id]-catScores[b.id]).slice(0,3).map(c=>c.id));
    const lessonsDone = Object.keys(D.lessons).length;
    let pool = this.candidates().filter(c=>!askedIds.has(c.id));
    if(mode==='review') pool = pool.filter(c=>c.it.some(id=>due.has(id)));
    else if(mode==='weak') pool = pool.filter(c=>c.it.some(id=>strug.has(id)||strugRel.has(id)));
    else if(mode.startsWith('cat:')) pool = pool.filter(c=>c.c===mode.slice(4));
    else if(mode.startsWith('item:')) pool = pool.filter(c=>c.it.includes(mode.slice(5)));
    if(!pool.length) return null;
    const cand = weightedPick(pool, c=>{
      const ms = c.it.map(id=>this.score(id)); const m = ms.reduce((a,b)=>a+b,0)/ms.length;
      const introduced = c.it.some(id=>this.stage(id)>0);
      let w = .4 + (1-m)*2;
      if(c.it.some(id=>due.has(id))) w += 1.6;
      if(c.it.some(id=>this.peek(id)?.flag)) w += 2;
      if(c.it.some(id=>strug.has(id))) w += 1.4; else if(c.it.some(id=>strugRel.has(id))) w += .8;
      if(weakCats.has(c.c)) w += .5;
      const want = m<.3 ? 1 : m<.65 ? 2 : 3;
      w *= Math.max(.15, 1 - Math.abs((c.d||1)-want)*.4);
      if(!introduced && mode==='adaptive'){ w *= (c.d||1)===1 ? (lessonsDone ? .5 : .9) : .15; }
      if(recent.has(c.id)) w *= .08;
      if(prev && prev.c===c.c) w *= .55;         /* interleave categories */
      if(!c.gen) w *= 1.25;                        /* favour authored questions */
      return Math.max(.02, w);
    });
    return this.materialize(cand);
  },
  recommend(){
    const D = Store.data, L = LESSONS.find(l=>!D.lessons[l.id]);
    const due = this.dueItems().length, strug = this.struggling();
    if(!Object.keys(D.lessons).length) return {title:'Start with “What Linux is”', why:'A short lesson sets up the vocabulary everything else uses.', act:'lesson', arg:'L01', btn:'Open lesson'};
    if(due>=5) return {title:`Review ${due} items that are due`, why:'Spaced review now locks them into long-term memory.', act:'practice', arg:'review', btn:'Start review'};
    if(strug.length){ const cat = itemCat(strug[0]); return {title:`Strengthen: ${CAT[cat].name}`, why:`Recent answers on ${strug.slice(0,3).map(itemName).join(', ')} are below 60% accuracy.`, act:'practice', arg:'weak', btn:'Drill weak spots'}; }
    const scen = SCENARIOS.find(s=>!D.scen[s.id]?.done && this.catScore(s.cat)>=.25);
    if(L && (!scen || Math.random()<.6)){ const cs=this.catScore(L.cat); return {title:`Next lesson: ${L.title}`, why:L.summary, act:'lesson', arg:L.id, btn:'Open lesson'}; }
    if(scen) return {title:`Scenario: ${scen.title}`, why:'Your practice in this area is strong enough to solve a realistic incident.', act:'scenario', arg:scen.id, btn:'Start scenario'};
    if(due) return {title:`Review ${due} due item${due>1?'s':''}`, why:'Keeping reviews at zero keeps mastery from decaying.', act:'practice', arg:'review', btn:'Start review'};
    return {title:'Play a round of Derezz', why:'Fast recall under time pressure turns knowledge into reflex.', act:'game', btn:'Play'};
  }
};

/* =====================================================================
   ACHIEVEMENTS
   ===================================================================== */
const ACHIEVEMENTS = [

const Nux = {
  mount(){ if(!document.getElementById('nx-stand')) document.body.insertAdjacentHTML('afterbegin', NUX_SPRITE); },
  svg(pose, cls='', title=''){ return `<svg class="nux ${cls}" viewBox="${NUX_VB[pose]}" ${title?`role="img" aria-label="${title}"`:'aria-hidden="true" focusable="false"'}><use href="#nx-${pose}"/></svg>`; },
  /* standalone SVG (own defs) for <canvas>; data URL, no network */
  image(pose){ const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${NUX_VB[pose]}"><defs>${NUX_DEFS}</defs>${NUX_RAW[pose]}</svg>`); return img; },
  still(){ return (Store.data?.settings?.reduceMotion) || matchMedia('(prefers-reduced-motion: reduce)').matches; },
  /* throw an identity disc from one element toward another; it returns like a boomerang */
  throwDisc(fromEl, toEl){
    if(this.still() || !fromEl || !toEl || !fromEl.getClientRects().length) return;
    const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
    const d=document.createElement('div'); d.className='nux-flydisc'; d.innerHTML=this.svg('disc');
    const x0=a.left+a.width*.78, y0=a.top+a.height*.18, x1=b.left+Math.min(b.width*.5,260), y1=b.top+28;
    Object.assign(d.style,{left:x0+'px',top:y0+'px'}); document.body.append(d);
    d.animate([{transform:'translate(0,0) rotate(0turn) scale(.6)'},{transform:`translate(${x1-x0}px,${y1-y0}px) rotate(3turn) scale(1)`,offset:.5},{transform:'translate(0,0) rotate(6turn) scale(.6)'}],{duration:1300,easing:'cubic-bezier(.3,.7,.4,1)'}).onfinish=()=>d.remove();
    fromEl.animate([{transform:'rotate(0)'},{transform:'rotate(-8deg)'},{transform:'rotate(0)'}],{duration:450});
  },
  /* a light-cycle run across an element (celebration) */
  zoom(host){
    if(this.still() || !host) return;
    const r=document.createElement('div'); r.className='nux-zoom'; r.innerHTML=`<i class="nux-trail"></i>${this.svg('cycle')}`; host.style.position=host.style.position||'relative'; host.append(r);
    r.animate([{transform:'translateX(-120px)'},{transform:`translateX(${host.clientWidth+40}px)`}],{duration:1600,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>r.remove();
  }
};

const VIEWS = [

const UI = {
  view:'dashboard', lastInput:Date.now(),
  init(){
    const nav = $('#nav');
    nav.innerHTML = VIEWS.map((v,i)=>`<li role="presentation"><button role="tab" id="tab-${v.id}" aria-controls="view-${v.id}" aria-selected="false" tabindex="-1" data-view="${v.id}" title="${v.name} (Alt+${i+1})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[v.id]}</svg><span>${v.name}</span>${v.id==='practice'?'<span class="badge" id="dueBadge" hidden></span>':''}</button></li>`).join('');
    nav.addEventListener('click', e=>{ const b=e.target.closest('[data-view]'); if(b) this.show(b.dataset.view); });
    nav.addEventListener('keydown', e=>{
      const tabs=$$('[role=tab]',nav); const i=tabs.indexOf(document.activeElement); if(i<0) return;
      const vertical = getComputedStyle($('.side')).flexDirection==='column';
      const prevK = vertical?'ArrowUp':'ArrowLeft', nextK = vertical?'ArrowDown':'ArrowRight';
      let j=null; if(e.key===nextK) j=(i+1)%tabs.length; if(e.key===prevK) j=(i-1+tabs.length)%tabs.length; if(e.key==='Home') j=0; if(e.key==='End') j=tabs.length-1;
      if(j!==null){ e.preventDefault(); tabs[j].focus(); this.show(tabs[j].dataset.view); }
    });
    document.addEventListener('keydown', e=>{ this.lastInput=Date.now(); if(e.altKey && /^[1-8]$/.test(e.key)){ e.preventDefault(); this.show(VIEWS[+e.key-1].id); $('#tab-'+this.view).focus(); } });
    document.addEventListener('pointerdown', ()=>this.lastInput=Date.now());
    $('#btnSettings').onclick = $('#btnSettings2').onclick = ()=>Settings.open();
    /* active-time tracking: counts only while visible and recently used */
    setInterval(()=>{ if(document.hidden || Date.now()-this.lastInput>90000) return; const D=Store.data; D.time[this.view]=(D.time[this.view]||0)+5000; const g=D.daily[today()]||(D.daily[today()]={xp:0,q:0,ok:0,ms:0,m:Engine.overall()}); g.ms+=5000; Store.save(); }, 5000);
    const start = (location.hash||'').slice(1); this.show(VIEWS.some(v=>v.id===start)?start:'dashboard');
    window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(h!==this.view && VIEWS.some(v=>v.id===h)) this.show(h); });
    this.chrome();
  },
  show(id, arg){
    if(this.view==='game' && id!=='game') Game.pause(true);
    this.view=id;
    VIEWS.forEach(v=>{ const on=v.id===id; $('#view-'+v.id).classList.toggle('active',on); const t=$('#tab-'+v.id); t.setAttribute('aria-selected',on); t.tabIndex=on?0:-1; });
    if(location.hash!=='#'+id) history.replaceState(null,'','#'+id);
    Views[id].render(arg);
    this.chrome();
    window.scrollTo(0,0);
  },
  chrome(){
    const L=Engine.level(); $('#sfLevel').textContent=L.name; $('#mtLevel').textContent=`${L.name} · ${pct(L.m)}%`;
    $('#sfXp').style.width=pct(L.toNext)+'%'; $('#sfXpText').textContent=`${Store.data.xp.toLocaleString()} XP`;
    const due=Engine.dueItems().length, b=$('#dueBadge'); if(b){ b.hidden=!due; b.textContent=due; b.setAttribute('aria-label',`${due} items due for review`); }
  },
  toast(msg, amber){ const t=document.createElement('div'); t.className='toast'+(amber?' amber':''); t.textContent=msg; const box=$('#toasts'); box.append(t); while(box.children.length>3) box.firstElementChild.remove(); setTimeout(()=>t.remove(), 3800); },
  announce(msg){ $('#live').textContent=''; setTimeout(()=>$('#live').textContent=msg, 30); },
  dialog(html, {onOpen}={}){ const d=$('#dlg'); d.innerHTML=html; d.showModal(); onOpen&&onOpen(d); return d; },
  confirm(title, bodyHtml, okLabel='Continue', danger=false){
    return new Promise(res=>{ const d=this.dialog(`<h2 id="dlgTitle">${esc(title)}</h2><div class="stack">${bodyHtml}</div><div class="row" style="justify-content:flex-end;margin-top:1rem"><button class="btn ghost" data-r="0">Cancel</button><button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(okLabel)}</button></div>`);
      d.onclick=e=>{ const b=e.target.closest('[data-r]'); if(b){ d.close(); res(b.dataset.r==='1'); } }; d.oncancel=()=>res(false); $('[data-r="0"]',d).focus(); });
  },
  pips(d){ return `<span class="pips" aria-label="Difficulty ${d} of 3">${[1,2,3].map(i=>`<i class="${i<=d?'on':''}"></i>`).join('')}</span>`; },
  stagePill(id){ const s=Engine.stage(id); return `<span class="stage-pill s${s}">${STAGES[s]}</span>`; },
  applySettings(){ const S=Store.data.settings; document.documentElement.dataset.theme=S.theme==='light'?'light':'grid'; document.documentElement.style.setProperty('--fs', (17*S.scale)+'px'); document.documentElement.classList.toggle('reduce-motion', !!S.reduceMotion); }
};

/* ---------- Question component (used by Practice and Learn checks) ---------- */
const QuestionView = {
  /* renders q into el; calls done(ok) after the learner answers; next() when they continue */
  mount(el, q, {done, next, nextLabel='Next question', src='practice'}){
    const started = Date.now(); let answered=false;
    const head = `<div class="q-meta"><span class="tag cyan">${esc(q.lab)}</span><span class="tag">${esc(CAT[q.c]?.name||'')}</span>${UI.pips(q.d||1)}<span class="small faint">${q.it.slice(0,3).map(itemName).map(esc).join(', ')}</span></div>
      <p class="q-prompt" id="qp">${md(q.p)}</p>${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}`;
    let body='';
    if(q.k==='mc'){ q._o = q._o || shuffle(q.o); body = `<div class="opts-list" role="group" aria-labelledby="qp">${q._o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${md(o[0])}<span class="why" hidden>${md(o[2])}</span></span></button>`).join('')}</div><p class="small faint">Press 1–${q._o.length} to answer.</p>`; }
    if(q.k==='fill'){ body = `<form class="row" style="margin:1rem 0" onsubmit="return false"><label class="sr-only" for="qin">Your command</label><input id="qin" class="inp mono" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the command…" style="flex:1;min-width:220px"><button class="btn primary" id="qsub">Check</button></form><p class="small faint">Type it as you would in Bash. Enter checks your answer.</p>`; }
    if(q.k==='order'){ q._pool = q._pool || shuffle(q.seq.map((s,i)=>({s,i}))); body = `<p class="small muted">Select the steps in order. Select a placed step to remove it.</p><div class="seq" id="seqAns" aria-label="Your order"></div><div class="chips" id="seqPool">${q._pool.map((x,k)=>`<button class="btn sm ghost" data-k="${k}"><code>${esc(x.s)}</code></button>`).join('')}</div><div class="row" style="margin-top:1rem"><button class="btn primary" id="qsub" disabled>Check order</button></div>`; }
    if(q.k==='match'){ q._opts = q._opts || shuffle(q.pairs.map(p=>p[1])); body = `<div style="margin:1rem 0">${q.pairs.map((p,i)=>`<div class="match-row"><label for="m${i}"><code>${esc(p[0])}</code></label><select class="inp" id="m${i}"><option value="">Choose…</option>${q._opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div><button class="btn primary" id="qsub">Check matches</button>`; }
    el.innerHTML = `<div class="q-wrap">${head}${body}<div id="qfb" aria-live="polite"></div></div>`;

    const finish = (ok, extra='') => {
      if(answered) return; answered=true;
      const ms = Date.now()-started;
      Engine.record(q.it, ok, {kind:q.lab, d:q.d||1, qid:q.id, src, ms});
      const model = q.k==='fill' ? `<dt>Model answer</dt><dd><code>${esc(q.s)}</code></dd>` : q.k==='order' ? `<dt>Correct order</dt><dd>${q.seq.map((s,i)=>`${i+1}. <code>${esc(s)}</code>`).join('<br>')}</dd>` : '';
      $('#qfb',el).innerHTML = `<div class="fb ${ok?'good':'bad'}">${Nux.svg(ok?'throw':'duck','nux-fb')}<h3>${ok?'Correct':'Not quite'}</h3>${extra}<p>${md(q.ex)}</p><dl>${model}${q.con?`<dt>Concept</dt><dd>${md(q.con)}</dd>`:''}${q.rem?`<dt>Remember</dt><dd>${md(q.rem)}</dd>`:''}</dl></div><div class="row" style="margin-top:1rem"><button class="btn primary" id="qnext">${esc(nextLabel)}</button><span class="small faint">or press Enter</span></div>`;
      UI.announce(ok?'Correct.':'Incorrect. Explanation below.');
      const nb=$('#qnext',el); nb.onclick=()=>{ cleanup(); next&&next(); }; setTimeout(()=>nb.focus(),30);
      done&&done(ok); UI.chrome();
    };
    const keyh = e => {
      if(!el.isConnected || !el.offsetParent){ cleanup(); return; }
      if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'){ return; }
      if(!answered && q.k==='mc' && /^[1-9]$/.test(e.key)){ const b=$(`.opt[data-i="${+e.key-1}"]`,el); if(b){ e.preventDefault(); b.click(); } }
    };
    const cleanup = () => document.removeEventListener('keydown', keyh);
    document.addEventListener('keydown', keyh);

    if(q.k==='mc'){
      $$('.opt',el).forEach(b=>b.onclick=()=>{ if(answered) return; const i=+b.dataset.i, ok=!!q._o[i][1];
        $$('.opt',el).forEach((x,k)=>{ x.disabled=true; if(q._o[k][1]) x.classList.add('right'); $('.why',x).hidden=false; }); if(!ok) b.classList.add('wrong');
        finish(ok, ok?'':`<p class="small">Why the options differ is shown under each one.</p>`); });
      setTimeout(()=>$('.opt',el)?.focus(),30);
    }
    if(q.k==='fill'){ const inp=$('#qin',el); setTimeout(()=>inp.focus(),30);
      const go=()=>{ if(answered||!inp.value.trim()) return; const ok=matchAnswer(inp.value, q.a, q.s); inp.readOnly=true; $('#qsub',el).disabled=true; finish(ok, ok?'':`<p>You typed <code>${esc(inp.value.trim())}</code>.</p>`); };
      $('#qsub',el).onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); if(!answered) go(); else $('#qnext',el)?.click(); } }; }
    if(q.k==='order'){ const chosen=[]; const drawAns=()=>{ $('#seqAns',el).innerHTML = chosen.map((k,n)=>`<button class="seq-item" data-n="${n}" aria-label="Remove step ${n+1}"><span class="num">${n+1}</span><code>${esc(q._pool[k].s)}</code></button>`).join('') || '<p class="small faint">No steps placed yet.</p>'; $$('#seqPool [data-k]',el).forEach(b=>b.hidden=chosen.includes(+b.dataset.k)); $('#qsub',el).disabled=chosen.length!==q._pool.length; };
      $('#seqPool',el).onclick=e=>{ const b=e.target.closest('[data-k]'); if(!b||answered) return; chosen.push(+b.dataset.k); drawAns(); const nx=$$('#seqPool [data-k]',el).find(x=>!x.hidden); (nx||$('#qsub',el)).focus(); };
      $('#seqAns',el).onclick=e=>{ const b=e.target.closest('[data-n]'); if(!b||answered) return; chosen.splice(+b.dataset.n,1); drawAns(); };
      $('#qsub',el).onclick=()=>{ const ok=chosen.every((k,n)=>q._pool[k].i===n); $$('button',$('#seqAns',el)).forEach(b=>b.disabled=true); $$('#seqPool button',el).forEach(b=>b.disabled=true); $('#qsub',el).disabled=true; finish(ok); };
      drawAns(); setTimeout(()=>$('#seqPool [data-k]',el)?.focus(),30); }
    if(q.k==='match'){ setTimeout(()=>$('select',el)?.focus(),30); $('#qsub',el).onclick=()=>{ if(answered) return; let right=0; q.pairs.forEach((p,i)=>{ const s=$('#m'+i,el); const ok=s.value===p[1]; if(ok) right++; s.disabled=true; s.style.borderColor=ok?'var(--cyan)':'var(--amber)'; if(!ok) s.insertAdjacentHTML('afterend',`<span class="small warn" style="grid-column:1/-1">${esc(p[0])}: ${esc(p[1])}</span>`); }); $('#qsub',el).disabled=true; finish(right===q.pairs.length, `<p>${right} of ${q.pairs.length} matched.</p>`); }; }
    el.onkeydown = e => { if(answered && !e.defaultPrevented && e.key==='Enter' && e.target.id!=='qnext' && !['BUTTON','INPUT'].includes(e.target.tagName)){ e.preventDefault(); $('#qnext',el)?.click(); } };
  }
};

/* ---------- Dashboard ---------- */
function discSVG(){
  const cx=150, cy=150, R=128, segs=CATEGORIES.length, gap=2.2, circ=2*Math.PI*R;
  const segLen = circ/segs;
  const L=Engine.level();
  let arcs='';
  CATEGORIES.forEach((c,i)=>{ const s=Engine.catScore(c.id); const len=(segLen-gap)*s; const off=-(i*segLen);
    arcs += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="14" stroke-dasharray="${segLen-gap} ${circ}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(c.name)}: ${pct(s)}%</title></circle>
    <circle class="seg" cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--cyan)" stroke-width="14" stroke-dasharray="${len} ${circ}" stroke-dashoffset="${off}" transform="rotate(-90 ${cx} ${cy})" style="filter:drop-shadow(0 0 4px var(--glow))"><title>${esc(c.name)}: ${pct(s)}%</title></circle>`; });
  const inner=2*Math.PI*98;
  return `<svg class="disc" viewBox="0 0 300 300" role="img" aria-label="Overall mastery ${pct(L.m)} percent, level ${L.name}. Each outer segment is one skill area.">
    <circle cx="150" cy="150" r="146" fill="none" stroke="var(--line)" stroke-width="1"/>
    ${arcs}
    <circle cx="150" cy="150" r="98" fill="none" stroke="var(--line)" stroke-width="4"/>
    <circle cx="150" cy="150" r="98" fill="none" stroke="var(--cyan2)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${inner*L.toNext} ${inner}" transform="rotate(-90 150 150)"/>
    <circle cx="150" cy="150" r="84" fill="var(--void)" stroke="var(--line2)"/>
    <text x="150" y="146" text-anchor="middle" class="disc-label" fill="var(--text)" font-size="46" font-weight="600">${pct(L.m)}%</text>
    <text x="150" y="176" text-anchor="middle" class="disc-label" fill="var(--cyan)" font-size="19">${esc(L.name)}</text>
    <text x="150" y="198" text-anchor="middle" fill="var(--faint)" font-size="11" font-family="var(--font-b)">overall mastery</text>
  </svg>`;
}
function chartSVG(days=30){
  const D=Store.data.daily, W=640, H=220, P={l:34,r:10,t:12,b:24};
  const pts=[]; let lastM=0;
  for(let i=days-1;i>=0;i--){ const k=today(Date.now()-i*DAY); const g=D[k]; if(g&&g.m!=null) lastM=g.m; pts.push({k, m:lastM, q:g?.q||0}); }
  const maxQ=Math.max(10,...pts.map(p=>p.q)); const x=i=>P.l+i*(W-P.l-P.r)/(days-1); const y=v=>P.t+(1-v)*(H-P.t-P.b);
  const bw=(W-P.l-P.r)/days*.6;
  const bars=pts.map((p,i)=>p.q?`<rect x="${x(i)-bw/2}" y="${H-P.b-(p.q/maxQ)*(H-P.t-P.b)*.45}" width="${bw}" height="${(p.q/maxQ)*(H-P.t-P.b)*.45}" fill="var(--line2)"><title>${p.k}: ${p.q} questions</title></rect>`:'').join('');
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.m).toFixed(1)}`).join('');
  const grid=[0,.25,.5,.75,1].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${v*100}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mastery over the last ${days} days, currently ${pct(lastM)} percent">${grid}${bars}<path d="${line}" fill="none" stroke="var(--cyan)" stroke-width="2.4" style="filter:drop-shadow(0 0 4px var(--glow))"/><text x="${P.l}" y="${H-6}">${pts[0].k.slice(5)}</text><text x="${W-P.r}" y="${H-6}" text-anchor="end">today</text></svg>`;
}
function catBars(){ return `<div class="bars">${CATEGORIES.map(c=>{ const s=Engine.catScore(c.id); return `<div class="bar"><span>${esc(c.name)}</span><span class="track" role="progressbar" aria-label="${esc(c.name)}" aria-valuenow="${pct(s)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct(s)}%"></i></span><span class="v">${pct(s)}%</span></div>`; }).join('')}</div>`; }
function masteryMap(){ return `<div class="mmap">${COMMANDS.map(c=>{ const s=Engine.stage(c.n); return `<button class="mcell st${s}" data-cmd="${esc(c.n)}" title="${esc(c.n)}: ${STAGES[s]}">${esc(c.n)}</button>`; }).join('')}</div>

const Term = { sh:new Shell(), hi:-1, chal:null, lines:[] };
Views.terminal = { render(arg){

      if(e.key==='ArrowUp'){ e.preventDefault(); const h=Term.sh.hist; if(!h.length) return; Term.hi = Term.hi<0 ? h.length-1 : Math.max(0,Term.hi-1); inp.value=h[Term.hi]; }
      else if(e.key==='ArrowDown'){ e.preventDefault(); const h=Term.sh.hist; if(Term.hi<0) return; Term.hi++; if(Term.hi>=h.length){ Term.hi=-1; inp.value=''; } else inp.value=h[Term.hi]; }

}, prompt(){ $('#tps1').textContent=Term.sh.prompt(); },
print(html){ const o=$('#tout'); o.insertAdjacentHTML('beforeend', html); while(o.childNodes.length>1500) o.firstChild.remove(); o.scrollTop=o.scrollHeight; },
async submit(){
  const inp=$('#tin'), line=inp.value; inp.value=''; Term.hi=-1;
  this.print(`<span class="ps1">${esc(Term.sh.prompt())}</span> ${esc(line)}\n`);

}, complete(inp){
  const v=inp.value, pos=v.length, m=/(\S*)$/.exec(v); const word=m[1]; const first=!v.slice(0,pos-word.length).trim() || /[|;&]\s*$/.test(v.slice(0,pos-word.length));

  }

}};

  $('#sShow').onclick=()=>{ const st=s.steps[this.run.i]; this.run.assisted++; this.run.revealed=true; $('#sIn').value=st.s; $('#sFb').innerHTML=`<p class="small">Model answer filled in: <code>${esc(st.s)}</code>. Run it to continue — this step will not count as solved on your own.</p>`; $('#sIn').focus(); };
  this.log(`<span class="note">Connected to ${esc(s.host)} (simulated). Output is scripted for this incident.</span>\n`);
  this.step();
}, log(h){ const l=$('#sLog'); l.insertAdjacentHTML('beforeend',h); l.scrollTop=l.scrollHeight; },
step(){ const R=this.run, s=R.s; R.miss=0; R.hinted=false; R.revealed=false;
  $('#sSteps').innerHTML=s.steps.map((st,i)=>`<li class="${i<R.i?'done':i===R.i?'cur':'todo'}">${i<R.i?'✓ ':''}${esc(i<=R.i?st.p:'Step '+(i+1))}</li>`).join('');
  if(R.i>=s.steps.length) return this.complete();
  $('#sPrompt').textContent=`Step ${R.i+1} of ${s.steps.length}: ${s.steps[R.i].p}`; $('#sFb').innerHTML=''; $('#sIn').value=''; $('#sIn').focus();
}, submit(){
  const R=this.run, st=R.s.steps[R.i], v=$('#sIn').value.trim(); if(!v) return;
  this.log(`<span class="ps1">${esc(R.s.host)}$</span> ${esc(v)}\n`);
  if(matchAnswer(v, st.a, st.s)){
    const clean = !R.miss && !R.hinted && !R.revealed; if(clean) R.first++;
    if(!R.revealed) Engine.record(st.it, clean, {kind:'Scenario', d:R.s.d, qid:R.s.id+'#'+R.i, src:'scenario'});
    if(st.out) this.log(esc(st.out)+'\n');
    R.i++; this.step();
    if(R.i<R.s.steps.length) $('#sFb').innerHTML=`<div class="fb good"><h3>${clean?'Right call':'That works'}</h3><p style="margin:0">${esc(st.why)}</p></div>`;
  } else {
    R.miss++; const trap=matchTrap(v, st.traps);
    if(R.miss===1 && !R.revealed) Engine.record(st.it, false, {kind:'Scenario', d:R.s.d, qid:R.s.id+'#'+R.i, src:'scenario'});
    this.log(`<span class="err">(no useful result for this step)</span>\n`);
    $('#sFb').innerHTML=`<div class="fb bad"><h3>Not what this step needs</h3><p>${esc(trap?trap.msg:(R.miss>=2?st.hint:'Think about what this step is asking you to learn, then try another command.'))}</p></div>`;
    $('#sIn').select();
  }
}, complete(){
  const R=this.run, s=R.s, D=Store.data, score=R.first/s.steps.length; R.over=true;
  const prev=D.scen[s.id]||{runs:0,best:0}; D.scen[s.id]={runs:prev.runs+1, best:Math.max(prev.best,score), done:true, last:Date.now()};
  Engine.xp(Math.round(20+40*score*s.d)); Engine.log(`Scenario solved: ${s.title} (${pct(score)}%)`); Achievements.check(); Store.save(); UI.chrome();
  $('#sPrompt').textContent='Incident resolved';
  $('#sFb').innerHTML=`<div class="fb good">${Nux.svg('cycle','nux-fb')}<h3>Resolved — ${R.first} of ${s.steps.length} steps on your own</h3><p>${esc(s.debrief)}</p></div><div class="row" style="margin-top:.8rem"><button class="btn primary" id="sAll">Back to scenarios</button><button class="btn ghost" id="sAgain">Run it again</button></div>`;
  Nux.zoom($('#sPrompt').parentElement); $('#sIn').disabled=true; $('#sRun').disabled=true; $('#sHint').disabled=true; $('#sShow').disabled=true;
  $('#sAll').onclick=()=>this.render(); $('#sAgain').onclick=()=>this.startRun(s.id); $('#sAll').focus();
}};

  const {k,dir}=this.sort; rows.sort((x,y)=>(x[k]>y[k]?1:x[k]<y[k]?-1:0)*dir);
  const t=$('#itemTbl'); t.innerHTML=`<thead><tr>${cols.map(([c,n])=>`<th scope="col" tabindex="0" data-k="${c}" aria-sort="${this.sort.k===c?(dir>0?'ascending':'descending'):'none'}">${n}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${r.id.startsWith('c:')?esc(r.name):`<code>${esc(r.name)}</code>`}</td><td>${esc(r.cat)}</td><td>${UI.stagePill(r.id)}</td><td class="num">${r.a}</td><td class="num">${r.acc<0?'—':pct(r.acc)+'%'}</td><td class="num">${pct(r.score)}%</td><td class="num">${r.due===Infinity?'—':r.due<=Date.now()?'<span class="warn">due</span>':Math.ceil((r.due-Date.now())/DAY)+' d'}</td></tr>`).join('')}</tbody>`;
  const go=e=>{ const th=e.target.closest('[data-k]'); if(!th) return; const kk=th.dataset.k; this.sort={k:kk,dir:this.sort.k===kk?-this.sort.dir:(['name','cat','due'].includes(kk)?1:-1)}; this.table(); $(`#itemTbl [data-k="${kk}"]`).focus(); };
  t.onclick=go; t.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(e); } };
}};

/* =====================================================================
   GAME · "Derezz". Rogue programs descend the grid, each carrying a task.
   Type the command that completes the task to derezz it before it reaches
   the core. Every 5th wave a daemon boss runs a multi-step incident.
   Answers feed the same mastery engine as Practice (source: game).
   ===================================================================== */
const Game = {
  W:960, H:600, LANES:5, state:'idle', raf:0,
  C:{bg:'#010407', grid:'#0c2a38', cyan:'#3fe0ff', cyan2:'#9df0ff', amber:'#ffa13d', text:'#dcf4ff', faint:'#5d7f90', white:'#e9fbff'},
  render(){
    const el=$('#view-game'), D=Store.data;
    if(!el.dataset.built){
      el.dataset.built='1';
      el.innerHTML=`<div class="view-head"><div><h1>Derezz</h1><p>Programs descend the grid carrying tasks. Type the command to derezz them before they reach the core.</p></div></div>
      <div class="game-wrap"><div>
        <div class="stage"><canvas id="gc" width="960" height="600" role="img" aria-label="Game field"></canvas><div class="overlay" id="gov"></div></div>
        <form class="game-in" onsubmit="return false"><label for="gin" class="sr-only">Command</label><input id="gin" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type a command, Enter to fire"><button class="btn primary" id="gfire">Fire</button></form>
        <p class="small faint">Enter fires at the highlighted program · Tab switches target · Esc pauses. An answer that fits a different program hits that one instead.</p>
        <div class="sr-only" id="gstatus" aria-live="polite"></div>
      </div>
      <aside class="stack"><div class="panel"><h3>How it teaches</h3><ul class="small" style="padding-left:1.1rem;margin:0"><li>Every answer is retrieval practice and updates mastery.</li><li>Tasks lean toward your weakest commands.</li><li>A miss shows the right command so you can correct it at once.</li><li>Waves 1–2 use foundational tasks; later waves add applied and advanced ones.</li><li>Combos multiply score up to ×4. Every 5th wave: a daemon boss.</li></ul></div>
        <div class="panel"><h3>High scores</h3><div id="ghs"></div></div></aside></div>`;
      this.cv=$('#gc'); this.ctx=this.cv.getContext('2d'); this.nux=Nux.image('cycle'); this.nux.onload=()=>{ if(this.state!=='play') this.draw(0); };
      const inp=$('#gin');
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); if(this.state==='play') this.fire(); else if(this.state!=='play') this.primary(); } else if(e.key==='Tab'&&this.state==='play'){ e.preventDefault(); this.cycle(); } else if(e.key==='Escape'){ e.preventDefault(); this.state==='play'?this.pause():this.state==='paused'&&this.resume(); } });
      $('#gfire').onclick=()=>{ this.state==='play'?this.fire():this.primary(); inp.focus(); };
      this.cv.addEventListener('click',()=>inp.focus());
      this.resize(); window.addEventListener('resize',()=>this.resize());
      this.overlay('idle');
      this.drawStatic();
    }
    this.hs(); setTimeout(()=>$('#gin').focus(),30);
  },
  resize(){ const dpr=Math.min(2,window.devicePixelRatio||1); this.cv.width=this.W*dpr; this.cv.height=this.H*dpr; this.ctx.setTransform(dpr,0,0,dpr,0,0); if(this.state!=='play') this.draw(0); },
  reduced(){ return Store.data.settings.reduceMotion || matchMedia('(prefers-reduced-motion: reduce)').matches; },
  hs(){ const H=Store.data.game.hs; $('#ghs').innerHTML=H.length?`<table class="hs"><thead><tr><th>#</th><th>Score</th><th>Wave</th><th>Acc.</th><th>Date</th></tr></thead><tbody>${H.map((h,i)=>`<tr><td>${i+1}</td><td class="n">${h.score.toLocaleString()}</td><td class="n">${h.wave}</td><td class="n">${h.acc}%</td><td class="small muted">${h.date}</td></tr>`).join('')}</tbody></table>`:'<p class="small muted">No runs yet. Scores are kept in this browser.</p>'; },
  overlay(kind, extra={}){
    const o=$('#gov'); o.hidden=kind==='none'; if(kind==='none') return;
    if(kind==='idle') o.innerHTML=`${Nux.svg('throw')}<h2>DEREZZ</h2><p>Defend the core. Type Linux commands to derezz incoming programs.</p><button class="btn primary" id="gstart">Start run</button><p class="small">or press Enter</p>`;
    if(kind==='paused') o.innerHTML=`<h2>Paused</h2><button class="btn primary" id="gstart">Resume</button><p class="small">Enter or Esc to resume</p>`;
    if(kind==='over') o.innerHTML=`${Nux.svg('duck')}<h2>Core breached</h2><p>Score <b style="color:#3fe0ff">${extra.score.toLocaleString()}</b> · wave ${extra.wave} · accuracy ${extra.acc}% · best combo ×${extra.combo}</p>${extra.missed.length?`<p class="small">Review: ${extra.missed.map(m=>`<code>${esc(m)}</code>`).join(' ')}</p>`:''}${extra.best?'<p style="color:#ffa13d">New personal best</p>':''}<button class="btn primary" id="gstart">Play again</button><p class="small">or press Enter</p>`;
    $('#gstart').onclick=()=>{ this.primary(); $('#gin').focus(); };
  },
  primary(){ if(this.state==='paused') this.resume(); else this.start(); },
  start(){
    this.s={score:0, wave:0, integrity:100, combo:0, maxCombo:0, hits:0, shots:0, enemies:[], fx:[], toSpawn:0, spawnT:0, banner:null, boss:null, missed:new Set(), recent:[], target:null, t:0, gridOff:0};
    this.state='play'; this.overlay('none'); Store.data.game.runs++; Store.save(); this.nextWave();
    $('#gin').value=''; $('#gin').focus(); this.last=performance.now(); cancelAnimationFrame(this.raf); this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  pause(silent){ if(this.state!=='play') return; this.state='paused'; this.overlay('paused'); if(!silent) $('#gin').focus(); },
  resume(){ if(this.state!=='paused') return; this.state='play'; this.overlay('none'); this.last=performance.now(); this.raf=requestAnimationFrame(t=>this.loop(t)); },
  nextWave(){ const s=this.s; s.wave++; const boss=s.wave%5===0;
    s.banner={txt:boss?`Wave ${s.wave} — daemon incoming`:`Wave ${s.wave}`, t:2.2};
    if(boss){ const B=BOSSES[(s.wave/5-1)%BOSSES.length]; s.boss={name:B.name, steps:B.steps, i:0, y:52, speed:5+s.wave*.5, hit:0, missedStep:false, showAns:0}; s.toSpawn=0; this.say(`Wave ${s.wave}. Boss: ${B.name}. ${B.steps[0].p}`); }
    else { s.toSpawn=3+s.wave; s.spawnT=1.2; this.say(`Wave ${s.wave}.`); } },
  pool(){ const s=this.s, maxD = s.wave<=2?1:s.wave<=6?2:3; return DRILLS.filter(d=>d.d<=maxD && !s.recent.includes(d.s) && !s.enemies.some(e=>e.q.s===d.s)); },
  spawn(){ const s=this.s; const lanesBusy=new Set(s.enemies.filter(e=>e.y<150).map(e=>e.lane)); const free=[...Array(this.LANES).keys()].filter(l=>!lanesBusy.has(l)); if(!free.length) return false;
    const q=weightedPick(this.pool(), d=>.3+(1-d.it.reduce((a,id)=>a+Engine.score(id),0)/d.it.length)*2); if(!q) return false;
    s.recent.push(q.s); if(s.recent.length>12) s.recent.shift();
    const lines=this.wrap(q.p, 160, '15px "IBM Plex Mono", monospace');
    s.enemies.push({lane:pick(free), y:-20-lines.length*18, q, lines, speed:(14+s.wave*2.6)*(0.9+Math.random()*.2), showAns:0, missed:false, flash:0}); return true; },
  wrap(text, w, font){ const c=this.ctx; c.font=font; const words=text.split(' '), out=[]; let cur=''; for(let wd of words){ while(c.measureText(wd).width>w){ let k=wd.length; while(k>1&&c.measureText(wd.slice(0,k)).width>w) k--; if(cur){ out.push(cur); cur=''; } out.push(wd.slice(0,k)); wd=wd.slice(k); } const t=cur?cur+' '+wd:wd; if(c.measureText(t).width>w && cur){ out.push(cur); cur=wd; } else cur=t; } if(cur) out.push(cur); return out; },
  laneX(l){ const lw=(this.W-40)/this.LANES; return 20+lw*l+lw/2; },
  targets(){ return [...this.s.enemies].sort((a,b)=>b.y-a.y); },
  current(){ const s=this.s; if(s.boss) return null; if(!s.target || !s.enemies.includes(s.target)) s.target=this.targets()[0]||null; return s.target; },
  cycle(){ const t=this.targets(); if(!t.length) return; const i=t.indexOf(this.s.target); this.s.target=t[(i+1)%t.length]; this.say(`Target: ${this.s.target.q.p}`); },
  say(m){ $('#gstatus').textContent=m; },
  fire(){
    const s=this.s, inp=$('#gin'), v=inp.value.trim(); if(!v) return; inp.value=''; s.shots++;
    const mult=()=>Math.min(4,1+Math.floor(s.combo/3)*.5);
    if(s.boss){ const st=s.boss.steps[s.boss.i];
      if(matchAnswer(v, st.a, st.s)){ Engine.record(st.it, !s.boss.missedStep, {kind:'Game', d:st.d, qid:'boss:'+st.s, src:'game'}); s.hits++; s.combo++; s.maxCombo=Math.max(s.maxCombo,s.combo); s.score+=Math.round(250*st.d*mult()); this.beam(this.W/2, s.boss.y+40, true); s.boss.i++; s.boss.hit=.4; s.boss.missedStep=false; s.boss.y=Math.max(52,s.boss.y-50);
        if(s.boss.i>=s.boss.steps.length){ s.score+=1000*(s.wave/5); this.burst(this.W/2, s.boss.y+40, 70); s.banner={txt:`${s.boss.name} derezzed +${1000*(s.wave/5)}`, t:2.4}; this.say(`${s.boss.name} derezzed.`); s.boss=null; Store.data.game.bestWave=Math.max(Store.data.game.bestWave, s.wave); setTimeout(()=>{ if(this.state==='play'||this.state==='paused') this.nextWave(); }, 1800); }
        else this.say(`Hit. Next: ${s.boss.steps[s.boss.i].p}`); }
      else { if(!s.boss.missedStep){ Engine.record(st.it,false,{kind:'Game',d:st.d,qid:'boss:'+st.s,src:'game'}); s.missed.add(st.s);} s.boss.missedStep=true; s.combo=0; s.boss.showAns=3; s.boss.speed*=1.12; this.say(`Miss. Answer: ${st.s}`); }
      return; }
    const cur=this.current(); if(!cur) return;
    const hit = [cur, ...this.targets().filter(e=>e!==cur)].find(e=>matchAnswer(v, e.q.a, e.q.s));
    if(hit){ Engine.record(hit.q.it, !hit.missed, {kind:'Game', d:hit.q.d, qid:'drill:'+hit.q.s, src:'game'}); s.hits++; s.combo++; s.maxCombo=Math.max(s.maxCombo,s.combo); const pts=Math.round((100+50*hit.q.d)*mult()); s.score+=pts;
      const x=this.laneX(hit.lane); this.beam(x, hit.y+20, false); this.burst(x, hit.y+20, 26); s.fx.push({type:'txt', x, y:hit.y, txt:`+${pts}${s.combo>=3?' ×'+mult():''}`, t:1, c:this.C.cyan});
      s.enemies=s.enemies.filter(e=>e!==hit); s.target=null; this.say(`Derezzed. ${s.combo>1?'Combo '+s.combo+'.':''}`); }
    else { if(!cur.missed){ Engine.record(cur.q.it, false, {kind:'Game', d:cur.q.d, qid:'drill:'+cur.q.s, src:'game'}); s.missed.add(cur.q.s); } cur.missed=true; cur.showAns=3; cur.flash=.5; cur.speed*=1.2; s.combo=0; this.say(`Miss. Answer: ${cur.q.s}`); }
    UI.chrome();
  },
  beam(x,y,boss){ this.s.fx.push({type:'beam', x, y, t:.25, boss}); },
  burst(x,y,n){ if(this.reduced()) n=Math.min(n,6); for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=60+Math.random()*220; this.s.fx.push({type:'p', x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, t:.6+Math.random()*.4}); } },
  loop(now){
    if(this.state!=='play') return;
    const dt=Math.min(.05,(now-this.last)/1000); this.last=now; const s=this.s; s.t+=dt;
    if(!this.reduced()) s.gridOff=(s.gridOff+dt*30)%40;
    if(s.banner){ s.banner.t-=dt; if(s.banner.t<=0) s.banner=null; }
    if(s.toSpawn>0){ s.spawnT-=dt; if(s.spawnT<=0){ if(this.spawn()){ s.toSpawn--; s.spawnT=Math.max(1.6, 4.2-s.wave*.22); } else s.spawnT=.5; } }
    const core=this.H-70;
    for(const e of s.enemies){ e.y+=e.speed*dt; e.showAns=Math.max(0,e.showAns-dt); e.flash=Math.max(0,e.flash-dt);
      if(e.y+e.lines.length*18+26>=core){ e.dead=true; s.integrity-=25; s.combo=0; if(!e.missed){ Engine.record(e.q.it,false,{kind:'Game',d:e.q.d,qid:'drill:'+e.q.s,src:'game'}); s.missed.add(e.q.s); } s.fx.push({type:'txt', x:this.laneX(e.lane), y:core-30, txt:e.q.s, t:2.4, c:this.C.amber}); this.burst(this.laneX(e.lane), core, 18); this.say(`Core hit. The answer was ${e.q.s}`); } }
    s.enemies=s.enemies.filter(e=>!e.dead);
    if(s.boss){ const b=s.boss; b.y+=b.speed*dt; b.hit=Math.max(0,b.hit-dt); b.showAns=Math.max(0,b.showAns-dt); if(b.y+120>=core){ s.integrity=0; s.fx.push({type:'txt',x:this.W/2,y:core-30,txt:b.steps[b.i].s,t:3,c:this.C.amber}); if(!b.missedStep){ const st=b.steps[b.i]; Engine.record(st.it,false,{kind:'Game',d:st.d,qid:'boss:'+st.s,src:'game'}); s.missed.add(st.s);} } }
    for(const f of s.fx){ f.t-=dt; if(f.type==='p'){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=.96; f.vy*=.96; } if(f.type==='txt') f.y-=20*dt; }
    s.fx=s.fx.filter(f=>f.t>0);
    if(!s.boss && s.toSpawn===0 && !s.enemies.length && !s.banner && s.wave%5!==0) this.nextWave();
    if(s.integrity<=0) return this.over();
    this.draw(dt);
    this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  over(){
    const s=this.s, G=Store.data.game; this.state='over'; this.draw(0);
    const acc=s.shots?Math.round(s.hits/s.shots*100):0; const best=s.score>G.best;
    G.best=Math.max(G.best,s.score); G.bestWave=Math.max(G.bestWave, s.wave-1); G.maxCombo=Math.max(G.maxCombo,s.maxCombo);
    G.hs.push({score:s.score, wave:s.wave, acc, date:today()}); G.hs.sort((a,b)=>b.score-a.score); G.hs.length=Math.min(G.hs.length,10);
    Engine.xp(Math.round(s.score/40)); Engine.log(`Derezz run: ${s.score.toLocaleString()} points, wave ${s.wave}`); Achievements.check(); Store.save(); UI.chrome(); this.hs();
    this.overlay('over',{score:s.score, wave:s.wave, acc, combo:s.maxCombo, missed:[...s.missed].slice(0,6), best}); this.say(`Game over. Score ${s.score}.`);
  },
  drawStatic(){ this.draw(0); },
  draw(){
    const c=this.ctx, C=this.C, W=this.W, H=this.H, s=this.s||{gridOff:0, enemies:[], fx:[], integrity:100, score:0, wave:0, combo:0};
    c.fillStyle=C.bg; c.fillRect(0,0,W,H);
    /* grid */
    c.strokeStyle=C.grid; c.lineWidth=1; c.beginPath();
    for(let x=20;x<=W-20;x+=(W-40)/this.LANES){ c.moveTo(x,0); c.lineTo(x,H-70); }
    for(let y=(s.gridOff||0)-40;y<H-70;y+=40){ c.moveTo(20,y); c.lineTo(W-20,y); } c.stroke();
    /* core */
    const core=H-70; const g=c.createLinearGradient(0,core,0,H); g.addColorStop(0,'rgba(63,224,255,.25)'); g.addColorStop(1,'rgba(63,224,255,0)'); c.fillStyle=g; c.fillRect(0,core,W,70);
    c.strokeStyle=s.integrity>40?C.cyan:C.amber; c.lineWidth=3; c.shadowColor=c.strokeStyle; c.shadowBlur=14; c.beginPath(); c.moveTo(0,core); c.lineTo(W,core); c.stroke(); c.shadowBlur=0;
    /* Nux on his light cycle */
    const px=W/2, py=H-38;
    c.strokeStyle='rgba(63,224,255,.55)'; c.lineWidth=3; c.shadowColor=C.cyan; c.shadowBlur=10; c.beginPath(); c.moveTo(0,py+13); c.lineTo(px-44,py+13); c.stroke(); c.shadowBlur=0;
    if(this.nux && this.nux.complete && this.nux.naturalWidth!==0){ c.drawImage(this.nux, px-72, py-72, 144, 91); }
    else { c.fillStyle=C.cyan; c.beginPath(); c.moveTo(px-34,py+10); c.lineTo(px-18,py-8); c.lineTo(px+22,py-8); c.lineTo(px+36,py+10); c.closePath(); c.fill(); }
    /* enemies */
    const cur=this.state==='play'||this.state==='paused'?this.current?.():null;
    for(const e of s.enemies){ const x=this.laneX(e.lane), w=172, h=e.lines.length*18+20; const X=x-w/2, Y=e.y;
      c.fillStyle='rgba(20,8,0,.9)'; c.fillRect(X,Y,w,h);
      const on=e===cur; c.strokeStyle=e.flash>0?C.white:on?C.white:C.amber; c.lineWidth=on?2.5:1.5; c.shadowColor=C.amber; c.shadowBlur=on?16:6; c.strokeRect(X,Y,w,h); c.shadowBlur=0;
      if(on){ c.fillStyle=C.white; c.font='600 12px "Chakra Petch", sans-serif'; c.fillText('TARGET', X, Y-6); }
      c.fillStyle=C.text; c.font='15px "IBM Plex Mono", monospace'; e.lines.forEach((l,i)=>c.fillText(l, X+8, Y+22+i*18));
      if(e.showAns>0){ c.fillStyle=C.amber; c.font='600 14px "IBM Plex Mono", monospace'; const tx='→ '+e.q.s; const tw=c.measureText(tx).width; c.fillText(tx, Math.max(6, Math.min(X, W-tw-8)), Y+h+18); } }
    /* boss */
    if(s.boss){ const b=s.boss, cx=W/2, cy=b.y+50; c.save(); c.translate(cx,cy); c.strokeStyle=b.hit>0?C.white:C.amber; c.lineWidth=3; c.shadowColor=C.amber; c.shadowBlur=24; c.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/3*i+Math.PI/6; c.lineTo(Math.cos(a)*300, Math.sin(a)*62); } c.closePath(); c.fillStyle='rgba(30,10,0,.92)'; c.fill(); c.stroke(); c.shadowBlur=0; c.restore();
      c.textAlign='center'; c.fillStyle=C.amber; c.font='700 18px "Chakra Petch", sans-serif'; c.fillText(b.name.toUpperCase?b.name:b.name, cx, cy-24);
      c.fillStyle=C.text; c.font='16px "IBM Plex Mono", monospace'; c.fillText(b.steps[b.i]?.p||'', cx, cy+4);
      for(let i=0;i<b.steps.length;i++){ c.fillStyle=i<b.i?C.faint:C.amber; c.fillRect(cx-b.steps.length*14+i*28, cy+20, 22, 6); }
      if(b.showAns>0){ c.fillStyle=C.amber; c.font='600 15px "IBM Plex Mono", monospace'; c.fillText('→ '+b.steps[b.i].s, cx, cy+88); } c.textAlign='left'; }
    /* fx */
    for(const f of s.fx){ if(f.type==='beam'){ c.strokeStyle=C.cyan2; c.lineWidth=4*f.t/.25+1; c.shadowColor=C.cyan; c.shadowBlur=20; c.beginPath(); c.moveTo(W/2+30,H-86); c.lineTo(f.x,f.y); c.stroke(); c.shadowBlur=0; }
      if(f.type==='p'){ c.fillStyle=`rgba(157,240,255,${Math.min(1,f.t*1.6)})`; c.fillRect(f.x,f.y,3,3); }
      if(f.type==='txt'){ c.fillStyle=f.c; c.globalAlpha=Math.min(1,f.t); c.font='600 16px "IBM Plex Mono", monospace'; c.textAlign='center'; c.fillText(f.txt,f.x,f.y); c.textAlign='left'; c.globalAlpha=1; } }
    /* HUD */
    c.fillStyle='rgba(1,4,7,.94)'; c.fillRect(0,0,W,44); c.strokeStyle=C.grid; c.beginPath(); c.moveTo(0,44); c.lineTo(W,44); c.stroke();
    c.fillStyle=C.text; c.font='600 18px "Chakra Petch", sans-serif'; c.fillText(`SCORE ${String(s.score).padStart(6,'0')}`, 24, 30);
    c.fillText(`WAVE ${s.wave}`, 230, 30); c.fillStyle=s.combo>=3?C.cyan:C.faint; c.fillText(`COMBO ×${Math.min(4,1+Math.floor((s.combo||0)/3)*.5)} (${s.combo||0})`, 340, 30);
    c.fillStyle=C.faint; c.fillText('CORE', W-250, 30); c.strokeStyle=C.faint; c.strokeRect(W-196,16,170,16); c.fillStyle=s.integrity>40?C.cyan:C.amber; c.fillRect(W-194,18,166*Math.max(0,s.integrity)/100,12);
    if(s.banner){ c.globalAlpha=Math.min(1,s.banner.t); c.textAlign='center'; c.fillStyle=C.cyan; c.shadowColor=C.cyan; c.shadowBlur=18; c.font='700 40px "Chakra Petch", sans-serif'; c.fillText(s.banner.txt, W/2, H/2-40); c.shadowBlur=0; c.textAlign='left'; c.globalAlpha=1; }
  }
};
Views.game = { render(){ Game.render(); } };
/* ---- 60-app.js ---- */
/* =====================================================================
   BOOT
   ===================================================================== */
(function boot(){
  Nux.mount(); Store.load(); UI.applySettings(); UI.init(); Achievements.check();
  if(!Object.keys(Store.data.daily).length) Engine.log('Welcome to Grid5h3LL');
  window.addEventListener('beforeunload', ()=>Store.flush());
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ Store.flush(); Game.pause(true); } });
})();
</script>
