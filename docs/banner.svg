<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Grid5h3LL — Linux training system" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02060a"/><stop offset=".55" stop-color="#02060a" stop-opacity=".2"/><stop offset="1" stop-color="#02060a" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="#3fe0ff" stop-opacity=".16"/><stop offset="1" stop-color="#3fe0ff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="340" fill="#02060a"/>
  <!-- perspective floor -->
  <g stroke="#143a4d" stroke-width="1">
    <line x1="0" y1="215" x2="1200" y2="215"/><line x1="0" y1="228" x2="1200" y2="228"/><line x1="0" y1="245" x2="1200" y2="245"/>
    <line x1="0" y1="268" x2="1200" y2="268"/><line x1="0" y1="298" x2="1200" y2="298"/><line x1="0" y1="338" x2="1200" y2="338"/>
    <line x1="600" y1="205" x2="600" y2="340"/><line x1="600" y1="205" x2="420" y2="340"/><line x1="600" y1="205" x2="240" y2="340"/><line x1="600" y1="205" x2="60" y2="340"/><line x1="600" y1="205" x2="-120" y2="340"/>
    <line x1="600" y1="205" x2="780" y2="340"/><line x1="600" y1="205" x2="960" y2="340"/><line x1="600" y1="205" x2="1140" y2="340"/><line x1="600" y1="205" x2="1320" y2="340"/>
  </g>
  <rect width="1200" height="240" fill="url(#fade)"/>
  <rect width="1200" height="340" fill="url(#halo)"/>
  <line x1="0" y1="205" x2="1200" y2="205" stroke="#3fe0ff" stroke-opacity=".55" stroke-width="1.5"/>
  <!-- light-cycle trails -->
  <g fill="none" stroke-linecap="square" filter="url(#soft)">
    <path d="M0 300 H300 V262 H520" stroke="#3fe0ff" stroke-width="3"/>
    <path d="M1200 280 H930 V246 H700" stroke="#ffa13d" stroke-width="3"/>
  </g>
  <rect x="512" y="254" width="22" height="14" rx="2" fill="#9df0ff" filter="url(#glow)"/>
  <rect x="686" y="239" width="22" height="14" rx="2" fill="#ffc27a" filter="url(#glow)"/>
  <!-- prompt glyph -->
  <g transform="translate(262 62)" filter="url(#glow)">
    <rect x="0" y="0" width="84" height="84" fill="none" stroke="#3fe0ff" stroke-width="3"/>
    <path d="M18 26 L38 42 L18 58" fill="none" stroke="#3fe0ff" stroke-width="7"/>
    <path d="M44 60 H66" stroke="#3fe0ff" stroke-width="7"/>
  </g>
  <text x="372" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="14" fill="#e9fbff" filter="url(#glow)">Grid5h3LL</text>
  <text x="376" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" letter-spacing="2" fill="#3fe0ff">Learn Linux one command at a time</text>
  <text x="600" y="326" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#8cb0c1">student@linux-lab:~$ <tspan fill="#e9fbff">find /var/log -name "*.log" -mtime -1</tspan><tspan fill="#3fe0ff">▌</tspan></text>
</svg>
